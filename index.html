<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B2445">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono-192.png">
  <link rel="apple-touch-icon" href="icono-192.png">
  <script src="config.js"></script>
  <title>El Bombón Dorado · Gestión de Desarrollo</title>
  
  <!-- ============================================================
       Estilos
       ============================================================ -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:wght@600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">

<!-- Leaflet: el mapa geográfico. Usa OpenStreetMap, que es gratuito y no
     necesita clave de API ni cuenta de facturación. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   Estilos. Los colores y medidas son los mismos del diseño original.
   =================================================================== */

:root {
  --azul:   #123C7E;
  --marino: #0B2445;
  --oro:    #B98F1E;
  --oro-cl: #E3C567;
  --crema:  #EFEDE6;
  --papel:  #FBFAF6;
  --borde:  #E4E0D5;
  --tinta:  #12233C;
  --gris:   #6B7686;
  --gris-cl:#8B94A2;
  --verde:  #1E7A45;
  --rojo:   #C4453B;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--crema); font-family: 'Plus Jakarta Sans', Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
a { color: var(--azul); text-decoration: none; }
a:hover { color: #A8842B; }
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
.mono { font-family: 'IBM Plex Mono', monospace; }
@keyframes pulseDot { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
@keyframes girar { to { transform: rotate(360deg) } }

/* ========================== INICIO DE SESIÓN ========================== */

.login-fondo {
  min-height: 100vh; display: grid; align-content: center; justify-items: center;
  padding: 30px 20px;
  background: radial-gradient(120% 80% at 50% 0%, #123C7E 0%, #0B2445 55%, #071A33 100%);
}
.login-caja { width: 100%; max-width: 372px; }
.marca { display: flex; flex-direction: column; align-items: center; gap: 13px; margin-bottom: 28px; }
.marca-logo {
  width: 62px; height: 62px; border-radius: 50%;
  background: linear-gradient(160deg, #E3C567, #B98F1E);
  display: grid; place-items: center; color: var(--marino);
  font-family: 'Playfair Display', Georgia, serif; font-size: 27px;
}
.marca-nombre { font-family: 'Playfair Display', Georgia, serif; color: #F3E4B8; font-size: 24px; text-align: center; }
.marca-sub { color: #8FA8CE; font-size: 11.5px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; margin-top: 7px; text-align: center; }

.tarjeta-login { background: var(--papel); border-radius: 18px; padding: 24px 22px 26px; box-shadow: 0 24px 60px rgba(4,16,34,.45); }
.t-titulo { font-size: 17px; font-weight: 700; color: var(--marino); }
.t-sub { font-size: 13px; color: var(--gris); margin: 4px 0 18px; }
.campo-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7A8494; margin-bottom: 7px; }
.campo {
  width: 100%; height: 46px; border: 1.5px solid #DCD8CC; border-radius: 11px;
  padding: 0 13px; font-size: 15px; color: var(--tinta); background: #fff; outline: none;
}
.campo:focus { border-color: var(--azul); }
.campo.mb { margin-bottom: 15px; }
.campo-pin { font-size: 19px; letter-spacing: .35em; }

.btn-primario { width: 100%; height: 50px; margin-top: 18px; border: none; border-radius: 12px; background: var(--azul); color: #fff; font-size: 15.5px; font-weight: 700; }
.btn-primario:hover { background: #0B2A5B; }
.btn-primario[disabled] { opacity: .6; }

.separador { display: flex; align-items: center; gap: 10px; margin: 20px 0 13px; }
.separador .linea { height: 1px; background: #E4E0D5; flex: 1; }
.separador .txt { font-size: 10px; font-weight: 700; letter-spacing: .12em; color: #A6AEB9; }
.demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-demo-azul { height: 46px; border: 1.5px solid var(--azul); border-radius: 11px; background: #fff; color: var(--azul); font-size: 13.5px; font-weight: 700; }
.btn-demo-azul:hover { background: #EEF3FB; }
.btn-demo-oro { height: 46px; border: 1.5px solid var(--oro); border-radius: 11px; background: #FDF7E6; color: #8C6A11; font-size: 13.5px; font-weight: 700; }
.btn-demo-oro:hover { background: #F8EDCF; }
.pie-login { text-align: center; color: #6F87AD; font-size: 11px; margin-top: 17px; font-family: 'IBM Plex Mono', monospace; }
.error-login { background: #FDF3F2; border: 1px solid #F3DAD7; color: #A63A31; font-size: 12.5px; font-weight: 600; border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; }

/* ============================== ARMAZÓN ============================== */

.shell { display: flex; min-height: 100vh; background: var(--crema); flex-direction: row; }
.lateral {
  width: 248px; flex: 0 0 248px; background: var(--marino); padding: 22px 15px;
  display: flex; flex-direction: column; gap: 24px; min-height: 100vh;
}
.lateral-marca { display: flex; align-items: center; gap: 11px; padding: 0 6px; }
.logo-38 { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(160deg, #E3C567, #B98F1E); display: grid; place-items: center; color: var(--marino); font-family: 'Playfair Display', Georgia, serif; font-size: 18px; flex: 0 0 auto; }
.lateral-nombre { color: #F3E4B8; font-family: 'Playfair Display', Georgia, serif; font-size: 15px; }
.lateral-sub { color: #7C93B8; font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-top: 2px; }
.lateral-nav { display: flex; flex-direction: column; gap: 4px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  border: none; border-radius: 10px; padding: 11px 12px; font-size: 13.5px; font-weight: 700;
  background: transparent; color: #9DB3D3;
}
.nav-btn:hover { color: #F3E4B8; }
.nav-btn.activo { background: #1D4E8A; color: #F3E4B8; }
.lateral-pie { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 5px; }
.avatar-33 { width: 33px; height: 33px; border-radius: 50%; background: #1D4E8A; color: var(--oro-cl); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex: 0 0 auto; }
.usuario-nombre { color: #EAF1FA; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.usuario-rol { color: #7C93B8; font-size: 10.5px; }
.btn-salir { border: none; background: transparent; color: #7C93B8; font-size: 10px; font-weight: 700; }
.btn-salir:hover { color: var(--oro-cl); }

.col-principal { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

.cab-movil { position: sticky; top: 0; z-index: 20; background: var(--marino); padding: 11px 13px; display: none; align-items: center; gap: 9px; }
.logo-31 { width: 31px; height: 31px; border-radius: 50%; background: linear-gradient(160deg, #E3C567, #B98F1E); display: grid; place-items: center; color: var(--marino); font-family: 'Playfair Display', Georgia, serif; font-size: 15px; flex: 0 0 auto; }
.titulo-pantalla { color: #F3E4B8; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cab-usuario { color: #7C93B8; font-size: 10px; }
.chip-sync { display: flex; align-items: center; gap: 6px; background: #123457; border-radius: 999px; padding: 5px 9px; }
.chip-sync span { color: #CFDCEF; font-size: 10px; font-weight: 700; }
.punto { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--oro-cl); }
.punto.ok { background: #6BD68A; }

.main { flex: 1; padding: 28px 30px 36px; }

.nav-inferior { position: sticky; bottom: 0; z-index: 20; background: #fff; border-top: 1px solid #E1DDD1; display: none; padding: 6px 4px 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; border: none; background: transparent; border-radius: 12px; color: #98A0AC; }
.tab.activo { color: var(--azul); background: #EEF3FB; }
.tab .ico { font-size: 17px; line-height: 1; }
.tab .txt { font-size: 10.5px; font-weight: 700; }

@media (max-width: 859px) {
  .shell { flex-direction: column; }
  .lateral { display: none; }
  .cab-movil { display: flex; }
  .nav-inferior { display: flex; }
  .main { padding: 16px 14px 22px; }
}

/* ============================ PIEZAS COMUNES ============================ */

.ancho-1020 { max-width: 1020px; margin: 0 auto; }
.ancho-1180 { max-width: 1180px; margin: 0 auto; }
.ancho-980  { max-width: 980px;  margin: 0 auto; }
.ancho-740  { max-width: 740px;  margin: 0 auto; }
.ancho-720  { max-width: 720px;  margin: 0 auto; }

.fecha-hoy { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #A8842B; }
h1.titulo { margin: 6px 0 0; font-size: 24px; font-weight: 800; color: var(--marino); }
h1.titulo.solo { margin: 0; }
.subtexto { font-size: 13px; color: var(--gris); margin-top: 5px; }

.tarjeta { background: #fff; border: 1px solid var(--borde); border-radius: 16px; padding: 17px; }
.tarjeta-tit { font-size: 15px; font-weight: 800; color: var(--marino); }
.tarjeta-sub { font-size: 12px; color: var(--gris); margin: 4px 0 13px; }

.chip { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 6px; padding: 3px 7px; display: inline-block; }
.chip-verde { background: #E8F5EC; color: var(--verde); }
.chip-oro   { background: #FDF7E6; color: #8C6A11; }
.chip-azul  { background: #EEF3FB; color: var(--azul); }
.chip-rojo  { background: #FDF3F2; color: #A63A31; }
.chip-gris  { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #7A8494; background: #F2F0E8; border-radius: 6px; padding: 3px 7px; }

.vacio { background: #fff; border: 1px dashed #D7D2C4; border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--gris); font-size: 13px; }

/* ============================= RUTA DEL DÍA ============================= */

.encabezado-ruta { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 15px; }
.kpis-mini { display: flex; gap: 9px; }
.kpi-mini { background: #fff; border: 1px solid var(--borde); border-radius: 13px; padding: 10px 15px; min-width: 90px; }
.kpi-mini .num { font-size: 21px; font-weight: 800; color: var(--azul); }
.kpi-mini .num.oro { color: #A8842B; }
.kpi-mini .lab { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--gris-cl); }

.barra-progreso { height: 8px; border-radius: 999px; background: #E2DFD4; overflow: hidden; margin-bottom: 18px; }
.barra-progreso i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #123C7E, #B98F1E); }

.lista-ruta { display: flex; flex-direction: column; gap: 10px; }
.card-cliente {
  text-align: left; width: 100%; background: #fff; border: 1px solid var(--borde);
  border-left: 4px solid var(--azul); border-radius: 14px; padding: 14px 15px;
  display: flex; gap: 13px; align-items: center;
}
.card-cliente:hover { border-color: #C9A227; }
.card-cliente.hecha { border-left-color: var(--verde); }
.card-hora { flex: 0 0 auto; width: 56px; text-align: center; border-radius: 10px; padding: 8px 4px; background: #EEF3FB; color: var(--azul); }
.card-cliente.hecha .card-hora { background: #F1F6F2; color: var(--verde); }
.card-hora .h { font-size: 12.5px; font-weight: 800; }
.card-hora .o { font-size: 9px; font-weight: 700; margin-top: 1px; }
.card-nombre { font-size: 15px; font-weight: 700; color: var(--marino); line-height: 1.25; overflow-wrap: anywhere; }
.card-dir { font-size: 12px; color: var(--gris); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chevron { color: #C9A227; font-size: 19px; font-weight: 700; }

.aviso-sheets { margin-top: 18px; background: #FDF7E6; border: 1px dashed #DEC57F; border-radius: 13px; padding: 13px 15px; display: flex; gap: 11px; align-items: center; }
.aviso-sheets .etq { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #8C6A11; flex: 0 0 auto; }
.aviso-sheets .txt { flex: 1; font-size: 12px; color: #6A5A2E; }

/* =============================== VISITA =============================== */

.btn-volver { border: none; background: transparent; color: var(--azul); font-size: 13px; font-weight: 700; padding: 0 0 12px; }
.btn-volver:hover { color: #A8842B; }

.visita-cab { background: var(--marino); border-radius: 17px; padding: 19px; color: #fff; }
.visita-cab .fila { display: flex; justify-content: space-between; gap: 13px; align-items: flex-start; }
.visita-etapa { font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--oro-cl); }
.visita-cliente { font-size: 19px; font-weight: 800; margin-top: 6px; }
.visita-dir { font-size: 12px; color: #9DB3D3; margin-top: 4px; }
.cronometro { font-family: 'IBM Plex Mono', monospace; font-size: 25px; color: #F3E4B8; }
.cronometro-lab { font-size: 9px; font-weight: 700; letter-spacing: .1em; color: #7C93B8; }
.gps-fila { display: flex; align-items: center; gap: 9px; margin-top: 15px; background: #123457; border-radius: 11px; padding: 9px 12px; }
.gps-punto { width: 8px; height: 8px; border-radius: 50%; background: #6BD68A; animation: pulseDot 1.6s infinite; flex: 0 0 auto; }
.gps-punto.malo { background: #E3C567; }
.gps-texto { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #CFDCEF; }

.tarjeta-checkin { background: #fff; border: 1px solid var(--borde); border-radius: 17px; padding: 24px; margin-top: 13px; text-align: center; }
.tarjeta-checkin .tit { font-size: 17px; font-weight: 800; color: var(--marino); }
.tarjeta-checkin .sub { font-size: 13px; color: var(--gris); max-width: 380px; margin: 7px auto 0; }
.btn-oro { margin-top: 19px; width: 100%; max-width: 320px; height: 54px; border: none; border-radius: 14px; background: linear-gradient(150deg, #E3C567, #B98F1E); color: #21180A; font-size: 16px; font-weight: 800; }
.btn-oro:hover { filter: brightness(1.06); }
.btn-oro[disabled] { opacity: .65; }
.nota-precision { font-size: 10.5px; color: #93999F; margin-top: 12px; font-family: 'IBM Plex Mono', monospace; }

.secciones { display: flex; gap: 7px; overflow-x: auto; padding: 15px 2px 5px; -webkit-overflow-scrolling: touch; }
.pill { flex: 0 0 auto; border: 1.5px solid #DCD8CC; border-radius: 999px; padding: 9px 15px; font-size: 12.5px; font-weight: 700; background: #fff; color: #5A6472; }
.pill.activa { border-color: var(--azul); background: var(--azul); color: #fff; }

.lista-items { display: flex; flex-direction: column; gap: 9px; }
.item { display: flex; align-items: center; gap: 11px; border: 1px solid #EDEAE0; border-radius: 12px; padding: 10px 11px; }
.item .stepper, .item .precio-caja { flex: 0 0 auto; }
/* En pantalla vertical el nombre ocupa toda la fila y el contador baja a la derecha,
   así los nombres largos se leen completos. */
@media (max-width: 480px) {
  .item { flex-wrap: wrap; row-gap: 8px; }
  .item .flex1 { flex: 1 1 calc(100% - 49px); }
  .item .stepper, .item .precio-caja { margin-left: auto; }
}
.item-foto { width: 38px; height: 38px; border-radius: 9px; background: repeating-linear-gradient(135deg, #F1EEE4 0 5px, #E5E1D4 5px 10px); flex: 0 0 auto; }
.item-nombre { font-size: 13.5px; font-weight: 700; color: var(--tinta); line-height: 1.25; overflow-wrap: anywhere; }
.item-codigo { font-size: 10.5px; color: var(--gris-cl); font-family: 'IBM Plex Mono', monospace; margin-top: 2px; }
.item-sub { font-size: 11px; color: var(--gris-cl); margin-top: 2px; }

.stepper { display: flex; align-items: center; gap: 6px; }
.btn-step { width: 38px; height: 38px; border: 1.5px solid #DCD8CC; border-radius: 9px; background: var(--papel); color: var(--azul); font-size: 17px; font-weight: 700; }
.btn-step:active { background: #EEF3FB; }
.cantidad { width: 54px; height: 38px; text-align: center; font-size: 16px; font-weight: 800; color: var(--marino);
            border: 1.5px solid #DCD8CC; border-radius: 9px; background: #fff; outline: none; }
.cantidad:focus { border-color: var(--azul); background: #EEF3FB; }

.aviso { margin-top: 13px; border-radius: 11px; padding: 11px 13px; font-size: 12px; font-weight: 600; background: #F1F6F2; color: var(--verde); }
.aviso.malo { background: #FDF3F2; color: #A63A31; }

.precio-caja { display: flex; align-items: center; gap: 6px; background: #F7F5EE; border-radius: 10px; padding: 8px 10px; }
.precio-caja .sim { font-size: 12.5px; font-weight: 700; color: var(--gris-cl); }
.precio-caja input { width: 58px; border: none; background: transparent; font-size: 15.5px; font-weight: 800; color: var(--marino); outline: none; text-align: right; }
.precio-caja.nm { opacity: .55; }
.btn-nm { flex: 0 0 auto; border: 1.5px solid #DCD8CC; border-radius: 9px; background: #fff; color: var(--gris); font-size: 11px; font-weight: 700; padding: 6px 8px; white-space: nowrap; }
.btn-nm.activa { border-color: var(--azul); background: #EEF3FB; color: var(--azul); }
@media (max-width: 480px) { .item .btn-nm { margin-left: 0; } }
.precio-caja .sim-btn { border: 1.5px solid #DCD8CC; border-radius: 8px; background: #fff; padding: 4px 8px; color: var(--azul); min-width: 34px; cursor: pointer; }
.precio-caja .sim-btn:active { background: #EEF3FB; }

/* Cierre con nota (visita no efectiva) */
.separador-o { text-align: center; font-size: 12px; font-weight: 700; color: var(--gris-cl); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .08em; }
.btn-texto { width: 100%; margin-top: 10px; padding: 12px; border: none; background: transparent; color: var(--gris); font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; }
.cierre-rapido { border-left: 4px solid var(--rojo); }
.cierre-rapido .opciones { flex-wrap: wrap; }
.cierre-rapido .opcion { flex: 1 1 45%; }
.campo-etq { font-size: 12px; font-weight: 700; color: var(--gris); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 7px; }
.campo-etq .obligatorio { color: var(--rojo); text-transform: none; letter-spacing: 0; }
.tarjeta-fin.no-efectiva { border-left: 4px solid var(--rojo); }
.tarjeta-fin.no-efectiva .fin-check { background: #FDF3F2; color: var(--rojo); }
.fin-nota { margin-top: 12px; padding: 11px 13px; background: #FBF9F3; border-radius: 11px; font-size: 13px; color: var(--tinta); white-space: pre-wrap; }
.card-cliente.no-efectiva { border-left-color: var(--rojo); }
.card-cliente.no-efectiva .card-hora { background: #FDF3F2; color: var(--rojo); }
.kpi-mini .num.rojo { color: var(--rojo); }
.foto-cat { font-size: 12px; font-weight: 800; color: var(--marino); text-transform: uppercase; letter-spacing: .06em; margin: 14px 0 8px; }
.foto-quitar { width: 100%; margin-top: 4px; border: none; background: transparent; color: var(--gris); font-size: 11.5px; font-weight: 700; text-decoration: underline; }
.foto.nohay .foto-thumb { opacity: .45; }
.foto-quitar.activa { color: var(--azul); font-weight: 800; }
.foto.nohay .foto-btn { opacity: .6; }
.espacio-cat { font-size: 11.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); margin: 10px 0 2px; padding-top: 6px; border-top: 1px dashed #E5E1D4; }
.espacio-cat:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.sos-cats { display: grid; gap: 5px; margin: 10px 0 4px; }
.sos-cat { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; }
.sos-cat .n { font-weight: 700; color: var(--tinta); flex: 1; }
.sos-cat .p { font-weight: 800; color: var(--verde); }
.sos-cat.malo .p { color: var(--rojo); }
.sos-cat .d { color: var(--gris-cl); font-size: 11px; }
.unidad-sel { display: flex; align-items: center; gap: 7px; margin: 4px 0 12px; }
.unidad-sel .lab { font-size: 12px; font-weight: 700; color: var(--gris); margin-right: 4px; }
.unidad-sel .opcion { flex: 0 0 auto; padding: 7px 14px; }

  seccion: 'inv',         // inv | pre | esp | pla | fot | not
  cierre: null,           // resumen mostrado tras el check-out
  cierreRapido: false,    // panel 'cerrar con nota' abierto

  cola: [],               // visitas guardadas en el teléfono esperando subir
  subiendo: false,
  exportando: false,
  guardandoPlan: false,
  diasAnalisis: 14,       // ventana de la sección de análisis
  enLinea: navigator.onLine !== false
};

/* Claves de almacenamiento en el teléfono */
var LS = {
  TOKEN:  'ebd_token',
  COLA:   'ebd_cola',
  VISITA: 'ebd_visita_en_curso',
  SESION: 'ebd_sesion',      // perfil + catálogos, para abrir sin señal (IndexedDB)
  RUTA:   'ebd_ruta',        // última ruta descargada (IndexedDB)
  ACCESO: 'ebd_acceso'       // huella del último acceso correcto (IndexedDB)
};

/* ========================= ALMACENAMIENTO LOCAL ========================= */

function guardarLocal(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) { console.warn('localStorage lleno', e); }
}
function leerLocal(clave, porDefecto) {
  try {
    var v = localStorage.getItem(clave);
    return v === null ? porDefecto : JSON.parse(v);
  } catch (e) { return porDefecto; }
}
function borrarLocal(clave) {
  try { localStorage.removeItem(clave); } catch (e) {}
  if (typeof borrarBd === 'function') borrarBd(clave);   // también el respaldo en IndexedDB
}

/* IndexedDB como respaldo: localStorage se queda corto (5 MB) cuando la
   visita lleva varias fotos, y ahí es donde más duele perder lo capturado.
   Todo se escribe en los dos sitios; al recuperar se usa el más completo. */
var _bd = null;
function bd() {
  if (_bd) return _bd;
  _bd = new Promise(function (resolve, reject) {
    if (!window.indexedDB) return reject(new Error('sin indexedDB'));
    var req = indexedDB.open('ebd', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('kv'); };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
  return _bd;
}
function guardarBd(clave, valor) {
  return bd().then(function (db) {
    return new Promise(function (resolve, reject) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(valor, clave);
      tx.oncomplete = resolve; tx.onerror = function () { reject(tx.error); };
    });
  }).catch(function (e) { console.warn('indexedDB', e); });
}
function leerBd(clave) {
  return bd().then(function (db) {
    return new Promise(function (resolve, reject) {
      var req = db.transaction('kv', 'readonly').objectStore('kv').get(clave);
      req.onsuccess = function () { resolve(req.result === undefined ? null : req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }).catch(function () { return null; });
}
function borrarBd(clave) { return guardarBd(clave, null); }

function guardarCola() {
  guardarLocal(LS.COLA, S.cola);
  return guardarBd(LS.COLA, S.cola);
}

/* Cada tecla dispara un guardado; con varias fotos en la visita, serializar
   todo cada vez consume memoria en teléfonos justos. Se espera un momento y
   se escribe una sola vez. inmediato = true fuerza la escritura ya. */
var _guardadoTimer = null;
function guardarVisitaEnCurso(inmediato) {
  clearTimeout(_guardadoTimer);
  if (!(S.visita && S.fase === 'form')) {
    borrarLocal(LS.VISITA);
    borrarBd(LS.VISITA);
    return;
  }
  var escribir = function () {
    if (!(S.visita && S.fase === 'form')) return;
    var g = { visita: S.visita, seccion: S.seccion, cierreRapido: !!S.cierreRapido, guardadoEn: Date.now() };
    guardarLocal(LS.VISITA, g);
    guardarBd(LS.VISITA, g);
  };
  if (inmediato) escribir(); else _guardadoTimer = setTimeout(escribir, 400);
}

/* Pide al navegador que no borre el almacenamiento aunque falte espacio. */
try {
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
} catch (e) {}

/* ====================== LLAMADAS AL SERVIDOR ====================== */

/**
 * Envuelve google.script.run en una promesa.
 * Todas las funciones del servidor responden { ok, datos } o { ok:false, error }.
 */
/* Dirección del servidor cuando la app corre instalada (fuera de Apps
   Script). La define pwa/config.js. Dentro de Apps Script no hace falta. */
var API_URL = (typeof window !== 'undefined' && window.EBD_API_URL) || '';
var DENTRO_DE_APPS_SCRIPT = !!(typeof google !== 'undefined' && google.script && google.script.run);

function errorConexion_(mensaje) {
  var e = new Error(mensaje || (navigator.onLine ? 'la petición fue bloqueada o no llegó (CORS/red).' : 'Sin conexión con el servidor.'));
  e.sinConexion = true;
  return e;
}

function procesarRespuesta_(r, resolve, reject) {
  var err = function (m) { var e = new Error(m); e.delServidor = true; return e; };
  if (!r) return reject(errorConexion_('El servidor no respondió.'));
  if (r.ok) return resolve(r.datos);
  if (r.sinSesion) { cerrarSesionLocal(); return reject(err('Tu sesión venció. Vuelve a entrar.')); }
  reject(err(r.error || 'Error desconocido.'));
}

/* Con muchos usuarios a la vez Apps Script puede responder lento o con
   errores pasajeros ("Servicio no disponible", "Lock timeout", cortes de
   red). Se reintenta hasta 3 veces con espera creciente antes de rendirse. */
var REINTENTABLE_ = /no disponible|unavailable|timeout|tiempo|lock|exceeded|too many|internal|service|502|503|504/i;

function api(funcion) {
  var args = Array.prototype.slice.call(arguments, 1);
  var intento = 0;
  function unaVez() {
    return apiUnaVez_(funcion, args).catch(function (e) {
      var pasajero = e && (e.sinConexion && navigator.onLine || (e.delServidor && REINTENTABLE_.test(e.message)));
      if (pasajero && intento < 3) {
        intento++;
        return new Promise(function (r) { setTimeout(r, 1500 * intento); }).then(unaVez);
      }
      throw e;
    });
  }
  return unaVez();
}

function apiUnaVez_(funcion, args) {
  if (DENTRO_DE_APPS_SCRIPT) {
    return new Promise(function (resolve, reject) {
      var enviar = google.script.run
        .withSuccessHandler(function (r) { procesarRespuesta_(r, resolve, reject); })
        .withFailureHandler(function (e) {
          var msg = (e && e.message) ? e.message : '';
          if (!navigator.onLine || /network|conex|fetch|load|timeout/i.test(msg) || !msg) return reject(errorConexion_());
          reject(new Error(msg));
        });
      enviar[funcion].apply(enviar, args);
    });
  }

  if (!API_URL) return Promise.reject(new Error('Falta la dirección del servidor (pwa/config.js).'));
  if (!navigator.onLine) return Promise.reject(errorConexion_());

  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var temporizador = ctrl ? setTimeout(function () { ctrl.abort(); }, 90000) : null;

  return fetch(API_URL, {
    method: 'POST',
    // text/plain evita la consulta previa (preflight) que Apps Script no atiende.
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn: funcion, args: args }),
    redirect: 'follow',
    signal: ctrl ? ctrl.signal : undefined
  })
    .then(function (resp) {
      if (!resp.ok) throw errorConexion_('el servidor respondió ' + resp.status + '.');
      return resp.text();
    })
    .then(function (texto) {
      var r;
      try { r = JSON.parse(texto); }
      catch (e) { throw errorConexion_('el servidor devolvió una página en vez de datos (implementación vieja o acceso no público).'); }
      return new Promise(function (resolve, reject) { procesarRespuesta_(r, resolve, reject); });
    })
    .catch(function (e) {
      // Lo que dijo el servidor se respeta; cualquier otra falla es de conexión.
      if (e && (e.sinConexion || e.delServidor)) throw e;
      throw errorConexion_();
    })
    .finally(function () { if (temporizador) clearTimeout(temporizador); });
}

/* ============================ INTERFAZ ============================ */

function cargando(activo) {
  S.cargando = activo;
  document.getElementById('cargando').classList.toggle('visible', !!activo);
}

var _avisoTimer = null;
function aviso(texto, malo) {
  var el = document.getElementById('aviso');
  el.textContent = texto;
  el.classList.toggle('malo', !!malo);
  el.classList.add('visible');
  clearTimeout(_avisoTimer);
  _avisoTimer = setTimeout(function () { el.classList.remove('visible'); }, malo ? 4200 : 2600);
}

/** Escapa texto antes de meterlo en el HTML. */
function esc(t) {
  return String(t === undefined || t === null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function mmss(seg) {
  var s = Math.max(0, Math.round(Number(seg) || 0));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function horaHM(d) {
  d = d || new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function fechaISOLocal(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function selloLocal(d) {
  d = d || new Date();
  return fechaISOLocal(d) + ' ' + horaHM(d) + ':' + String(d.getSeconds()).padStart(2, '0');
}

function uuid() {
  return 'V-' + Date.now().toString(36).toUpperCase() + '-' +
         Math.random().toString(36).slice(2, 8).toUpperCase();
}

/* ============================= ARRANQUE ============================= */

function iniciar() {
  S.cola = leerLocal(LS.COLA, []);
  var token = leerLocal(LS.TOKEN, null);

  // Si localStorage se quedó corto (fotos grandes), IndexedDB tiene la copia buena.
  var respaldo = Promise.all([leerBd(LS.COLA), leerBd(LS.VISITA), leerBd(LS.SESION), leerBd(LS.RUTA)]).then(function (r) {
    if (r[0] && r[0].length > S.cola.length) S.cola = r[0];
    _visitaRespaldo = r[1];
    _sesionRespaldo = r[2];
    _rutaRespaldo = r[3];
  });

  if (!token) { respaldo.then(render); render(); return; }

  cargando(true);
  respaldo
    .then(function () {
      // Sin señal no se pregunta al servidor: se arranca con lo guardado.
      if (!navigator.onLine && _sesionRespaldo && _sesionRespaldo.token === token) return _sesionRespaldo;
      return api('apiSesion', token).catch(function (e) {
        if (e && e.sinConexion && _sesionRespaldo && _sesionRespaldo.token === token) return _sesionRespaldo;
        throw e;
      });
    })
    .then(function (d) { aplicarSesion(d); recuperarVisitaEnCurso(); return cargarVista(); })
    .catch(function (e) {
      // Solo se cierra la sesión si el servidor dijo que venció. Cualquier
      // otra falla (servidor ocupado, red mala) arranca con la copia guardada.
      var vencida = e && e.delServidor && /venció|SIN_SESION/i.test(e.message);
      if (!vencida && _sesionRespaldo && _sesionRespaldo.token === token) {
        try { aplicarSesion(_sesionRespaldo); recuperarVisitaEnCurso(); } catch (e2) {}
        if (_rutaRespaldo && _rutaRespaldo.fecha === fechaISOLocal()) S.rutaDatos = _rutaRespaldo;
        setTimeout(function () { aviso('El servidor no respondió; trabajas con la copia guardada. Se reintenta solo.'); }, 500);
      } else if (vencida || !_sesionRespaldo) {
        cerrarSesionLocal();
      }
    })
    .then(function () {
      cargando(false);
      render();
      if (S.token && !navigator.onLine) aviso('Sin conexión: trabajas con la ruta guardada. Todo se sube cuando vuelva la señal.');
    });
}
var _visitaRespaldo = null;
var _sesionRespaldo = null;
var _rutaRespaldo = null;

function aplicarSesion(d) {
  S.token = d.token;
  S.perfil = d.perfil;
  S.catalogos = d.catalogos;
  S.config = d.config;
  S.vista = d.perfil.rol === 'admin' ? 'panel' : 'ruta';
  guardarLocal(LS.TOKEN, d.token);
  // Copia para poder abrir la app sin señal.
  if (d.perfil.rol !== 'admin') {
    guardarBd(LS.SESION, { token: d.token, perfil: d.perfil, catalogos: d.catalogos, config: d.config, guardadoEn: Date.now() });
  }
}

/* Huella local del acceso: permite entrar con usuario y PIN aunque no haya
   señal, siempre que ya haya entrado antes desde este teléfono. */
function huellaAcceso(usuario, pin) {
  var texto = String(usuario).toLowerCase().trim() + ':' + String(pin).trim() + ':ebd';
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }).catch(function () { return 'x' + huellaSimple_(texto); });
  }
  return Promise.resolve('x' + huellaSimple_(texto));
}
function huellaSimple_(t) {
  var h = 5381;
  for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return String(h >>> 0);
}

function cerrarSesionLocal() {
  borrarBd(LS.SESION);
  S.token = null; S.perfil = null; S.rutaDatos = null;
  S.panelDatos = null; S.analisisDatos = null; S.diaDatos = null;
  S.visita = null; S.fase = 'checkin'; S.cierre = null;
  S.monitorDatos = null; S.maestroDatos = null; S.modal = null;
  pararMonitor();
  borrarLocal(LS.TOKEN);
  pararCronometro();
  render();
}

/** Si la app se cerró con una visita a medio llenar, la recupera. */
function recuperarVisitaEnCurso() {
  var g = leerLocal(LS.VISITA, null);
  // Se usa la copia más reciente entre localStorage e IndexedDB.
  if (_visitaRespaldo && _visitaRespaldo.visita &&
      (!g || !g.visita || (_visitaRespaldo.guardadoEn || 0) >= (g.guardadoEn || 0))) g = _visitaRespaldo;
  if (!g || !g.visita) return;
  if (S.perfil && S.perfil.rol === 'admin') return;
  S.visita = g.visita;
  S.seccion = g.seccion || 'inv';
  S.cierreRapido = !!g.cierreRapido;
  if (!S.visita.monedas) S.visita.monedas = {};   // visitas guardadas antes de esta versión
  if (!S.visita.preciosNoMostrados) S.visita.preciosNoMostrados = {};
  if (!S.visita.fotosNoHay) S.visita.fotosNoHay = {};
  S.fase = 'form';
  S.vista = 'visita';
  arrancarCronometro();
  mantenerPantalla();
  var fotoPend = '';
  try { fotoPend = sessionStorage.getItem('ebd_foto_pendiente') || ''; sessionStorage.removeItem('ebd_foto_pendiente'); } catch (e) {}
  if (fotoPend) S.seccion = 'fot';
  setTimeout(function () {
    aviso(fotoPend
      ? 'La app se cerró al tomar la foto. Tu visita está intacta: vuelve a tomarla o elígela de la galería.'
      : 'Recuperamos la visita de ' + (S.visita.clienteNombre || 'tu cliente') + ' tal como la dejaste.');
  }, 600);
}

/* ================= NO PERDER LA VISITA SI LA APP SE CIERRA ================= */

/* Aviso del navegador si intentan cerrar o recargar con una visita abierta. */
window.addEventListener('beforeunload', function (ev) {
  if (S.visita && S.fase === 'form') {
    guardarVisitaEnCurso(true);
    ev.preventDefault();
    ev.returnValue = 'Tienes una visita a medio llenar. Está guardada en el teléfono, pero ¿seguro que quieres salir?';
    return ev.returnValue;
  }
});

/* Al pasar a segundo plano se guarda una vez más; al volver, se retoma. */
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (S.visita && S.fase === 'form') guardarVisitaEnCurso(true); }
  else if (S.visita && S.fase === 'form') mantenerPantalla();
});
window.addEventListener('pagehide', function () { if (S.visita && S.fase === 'form') guardarVisitaEnCurso(true); });

/* Mantiene la pantalla encendida mientras dura la visita (Wake Lock).
   Así el teléfono no la apaga a mitad del inventario y el navegador no
   descarta la pestaña por inactividad. Se libera al cerrar la visita. */
var _wakeLock = null;
function mantenerPantalla() {
  try {
    if (!navigator.wakeLock || _wakeLock) return;
    navigator.wakeLock.request('screen').then(function (wl) {
      _wakeLock = wl;
      wl.addEventListener('release', function () { _wakeLock = null; });
    }).catch(function () {});
  } catch (e) {}
}
function soltarPantalla() {
  if (_wakeLock) { try { _wakeLock.release(); } catch (e) {} _wakeLock = null; }
}

/* Cada 20 s se guarda igual, por si algún cambio no disparó el guardado. */
setInterval(function () { if (S.visita && S.fase === 'form') guardarVisitaEnCurso(); }, 20000);

/* ====================== CARGA DE DATOS POR VISTA ====================== */

function cargarVista() {
  if (!S.token) return Promise.resolve();

  if (S.vista === 'ruta' || S.vista === 'sync' || S.vista === 'visita') {
    var usarGuardada = function () {
      if (_rutaRespaldo && _rutaRespaldo.fecha === fechaISOLocal() && !S.rutaDatos) {
        S.rutaDatos = _rutaRespaldo;
        return true;
      }
      return false;
    };
    if (!navigator.onLine) {
      if (!usarGuardada() && !S.rutaDatos) aviso('Sin conexión y no hay ruta guardada para hoy. Abre la app con señal una vez al día.', true);
      return Promise.resolve();
    }
    return api('apiRuta', S.token, null)
      .then(function (d) {
        S.rutaDatos = d;
        _rutaRespaldo = d;
        guardarBd(LS.RUTA, d);
      })
      .catch(function (e) {
        if (e && e.sinConexion && usarGuardada()) return;
        if (S.rutaDatos === null) aviso(e.message, true);
      });
  }
  if (S.vista === 'micartera') {
    return api('apiMiCartera', S.token)
      .then(function (d) { S.miCarteraDatos = d; })
      .catch(function (e) { aviso(e.message, true); });
  }
  if (S.vista === 'dia') {
    return api('apiMiDia', S.token, null)
      .then(function (d) { S.diaDatos = d; })
      .catch(function (e) { aviso(e.message, true); });
  }
  if (S.vista === 'panel') {
    return api('apiPanel', S.token, null)
      .then(function (d) { S.panelDatos = d; })
      .catch(function (e) { aviso(e.message, true); });
  }
  if (S.vista === 'analisis') {
    return api('apiAnalisis', S.token, S.diasAnalisis)
      .then(function (d) { S.analisisDatos = d; })
      .catch(function (e) { aviso(e.message, true); });
  }
  if (S.vista === 'fotos') {
    return recargarFotos();
  }
  if (S.vista === 'analisisfotos') {
    return recargarAnalisisFotos();
  }
  if (S.vista === 'monitor') {
    return api('apiMonitor', S.token, null)
      .then(function (d) { S.monitorDatos = d; })
      .catch(function (e) { aviso(e.message, true); });
  }
  if (S.vista === 'cartera') {
    if (S.carteraTab === 'usuarios') return Promise.all([recargarMaestro(), recargarUsuarios()]);
    if (S.carteraTab === 'catalogos') return recargarCatalogos();
    return recargarMaestro();
  }
  return Promise.resolve();
}

function irA(vista) {
  S.vista = vista;
  S.modal = null;
  render();
  cargando(true);
  cargarVista().then(function () {
    cargando(false);
    render();
    if (vista === 'monitor') arrancarMonitor(); else pararMonitor();
  });
}

/* ====================== MONITOREO QUE SE REFRESCA ====================== */
/* Se actualiza solo mientras la pestaña esté a la vista. Si el
   administrador se va a otra ventana, deja de pedir datos: no tiene
   sentido gastar llamadas contra una pantalla que nadie está mirando. */

var _monitor = null;

function arrancarMonitor() {
  pararMonitor();
  if (!S.autoRefresco || !S.monitorDatos) return;
  var seg = Math.max(30, Number(S.monitorDatos.refrescoSeg) || 90);
  _monitor = setInterval(function () {
    if (S.vista !== 'monitor' || document.hidden || S.modal) return;
    refrescarMonitor(true);
  }, seg * 1000);
}

function pararMonitor() { if (_monitor) { clearInterval(_monitor); _monitor = null; } }

function refrescarMonitor(silencioso) {
  if (!silencioso) cargando(true);
  return api('apiMonitor', S.token, null)
    .then(function (d) {
      S.monitorDatos = d;
      if (!silencioso) cargando(false);
      render();
    })
    .catch(function (e) {
      if (!silencioso) { cargando(false); aviso(e.message, true); }
    });
}

document.addEventListener('visibilitychange', function () {
  if (!document.hidden && S.vista === 'monitor' && S.autoRefresco) refrescarMonitor(true);
});

/* ============================ CRONÓMETRO ============================ */
/* Actualiza solo el número, sin volver a dibujar la pantalla:
   así no se pierde el foco de los campos que el usuario está llenando. */

var _crono = null;

function arrancarCronometro() {
  pararCronometro();
  _crono = setInterval(function () {
    var el = document.getElementById('crono');
    if (el && S.visita) el.textContent = mmss(segundosVisita());
  }, 1000);
}
function pararCronometro() { if (_crono) { clearInterval(_crono); _crono = null; } }

function segundosVisita() {
  if (!S.visita || !S.visita.inicioMs) return 0;
  return Math.round((Date.now() - S.visita.inicioMs) / 1000);
}

/* =========================== ESTADO DE RED =========================== */

window.addEventListener('online', function () {
  S.enLinea = true;
  render();
  if (S.cola.length) subirCola(true);
});
window.addEventListener('offline', function () { S.enLinea = false; render(); });

/* ===================== RED DE SEGURIDAD ANTE ERRORES ===================== */
/* Si algo falla al dibujar, la pantalla no se queda en blanco: se muestra
   un aviso con botón para recargar. Lo capturado sigue guardado en el
   teléfono. El error se manda al Log del Sheet cuando hay señal. */
var _ultimoErrorReportado = '';
function reportarError(origen, e) {
  var texto = origen + ': ' + (e && e.message ? e.message : String(e)) + (e && e.stack ? ' | ' + String(e.stack).split('\n').slice(0, 3).join(' ') : '');
  texto = texto.slice(0, 600);
  console.error(texto);
  if (texto === _ultimoErrorReportado) return;
  _ultimoErrorReportado = texto;
  try {
    if (S.token && navigator.onLine) apiUnaVez_('apiReportarError', [S.token, 'v' + VERSION_APP + ' · ' + S.vista + ' · ' + texto]).catch(function () {});
  } catch (e2) {}
}

function pantallaError(e) {
  var app = document.getElementById('app');
  if (!app) return;
  app.innerHTML =
    '<div class="login-fondo"><div class="login-caja" style="text-align:center">' +
      '<div class="marca" style="justify-content:center"><div class="marca-logo">B</div></div>' +
      '<div class="tarjeta-login">' +
        '<div class="t-titulo">Algo salió mal en la pantalla</div>' +
        '<div class="t-sub" style="margin:8px 0 14px">Lo que capturaste está guardado en el teléfono. Recarga para continuar.</div>' +
        '<div class="error-login" style="text-align:left;font-size:11px">' + esc((e && e.message) || String(e)) + '</div>' +
        '<button class="btn-primario" type="button" onclick="location.reload()">Recargar la app</button>' +
      '</div>' +
      '<div class="pie-login">v' + VERSION_APP + '</div>' +
    '</div></div>';
}

window.addEventListener('error', function (ev) {
  reportarError('error', ev.error || ev.message);
  var app = document.getElementById('app');
  if (app && !app.innerHTML.trim()) pantallaError(ev.error || ev.message);
});
window.addEventListener('unhandledrejection', function (ev) {
  var r = ev.reason;
  if (r && (r.sinConexion || r.delServidor)) return;   // esos ya se muestran como aviso
  reportarError('promesa', r);
});

/* ============================= RUTA DEL DÍA ============================= */

/** Clientes que ya están guardados en el teléfono esperando subir. */
function clientesEnCola() {

}

function rutaConEstado() {
  if (!S.rutaDatos) return [];
  var enCola = clientesEnCola();
  return S.rutaDatos.ruta.map(function (c) {
    var copia = {};
    for (var k in c) copia[k] = c[k];
    copia.enCola = enCola.indexOf(c.clienteId) >= 0;
    copia.completada = c.completada || copia.enCola;
    if (copia.enCola) {
      var p = S.cola.filter(function (x) { return x.clienteId === c.clienteId; })[0];
      copia.efectiva = p ? p.efectiva !== false : copia.efectiva;
      copia.motivoCierre = p ? (p.motivoCierre || '') : copia.motivoCierre;
    }
    return copia;
  });
}

/* ------------------------- SHARE OF SHELF ------------------------- */

/** Suma lo medido y calcula qué porcentaje de el anaquel es nuestro. */
/** Unidad elegida en esta visita (cm o caras); si no eligió, la configurada. */
function unidadVisita() {
  var u = (S.visita && S.visita.unidadEspacio) || S.config.unidadEspacio;
  return u === 'cm' ? 'cm' : 'frentes';
}

function calcularSos() {
  var unidad = unidadVisita();
  var medido = (S.visita && S.visita.espacio) || {};
  var total = 0, propio = 0;
  var cats = [], porCat = {};
  S.catalogos.espacio.forEach(function (m) {
    var v = Number((medido[m.id] || {})[unidad]) || 0;
    var cat = m.categoria || S.config.categoria || '';
    if (!porCat[cat]) { porCat[cat] = { nombre: cat, total: 0, propio: 0 }; cats.push(cat); }
    porCat[cat].total += v;
    total += v;
    if (m.tipo === 'propia') { propio += v; porCat[cat].propio += v; }
  });
  return {
    unidad: unidad,
    total: total,
    propio: propio,
    pct: total ? Math.round(propio / total * 1000) / 10 : null,
    categorias: cats.map(function (c) {
      var x = porCat[c];
      return { nombre: x.nombre, total: x.total, propio: x.propio,
               pct: x.total ? Math.round(x.propio / x.total * 1000) / 10 : null };
    })
  };
}

function secEspacio() {
  var unidad = unidadVisita();
  var etiquetaUnidad = unidad === 'cm' ? 'cm' : 'caras';
  var r = calcularSos();
  var meta = S.config.metaSos;

  var catAnterior = null;
  var filas = S.catalogos.espacio.map(function (m) {
    var dato = S.visita.espacio[m.id] || {};
    var tipoTxt = m.tipo === 'propia' ? 'nuestra marca'
                : m.tipo === 'otras'  ? 'todo lo demás del anaquel'
                : 'competencia';
    var cat = m.categoria || S.config.categoria || '';
    var cabecera = '';
    if (cat !== catAnterior) {
      catAnterior = cat;
      cabecera = '<div class="espacio-cat">' + esc(cat) + '</div>';
    }
    return cabecera +
    '<div class="espacio-fila' + (m.tipo === 'propia' ? ' propia' : '') + '">' +
      '<div class="flex1">' +
        '<div class="espacio-marca">' + esc(m.marca) + '</div>' +
        '<div class="espacio-tipo">' + tipoTxt + '</div>' +
      '</div>' +
      '<div class="espacio-campo">' +
        '<input inputmode="numeric" data-espacio="' + esc(m.id) + '" data-u="' + unidad + '" ' +
               'value="' + esc(dato[unidad] === undefined ? '' : dato[unidad]) + '" placeholder="0">' +
        '<span class="u">' + etiquetaUnidad + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  return '' +
  '<div class="tarjeta">' +
    '<div class="tarjeta-tit">Espacio en anaquel</div>' +
    '<div class="tarjeta-sub">' +
      (unidad === 'cm'
        ? 'Mide con la cinta los centímetros lineales que ocupa cada marca, categoría por categoría.'
        : 'Cuenta las caras (frentes) visibles de cada marca, categoría por categoría.') +
      ' En cada categoría anota lo nuestro y lo de cada competidor; el share se calcula por categoría.' +
    '</div>' +
    '<div class="unidad-sel">' +
      '<span class="lab">Medir en</span>' +
      '<button class="opcion' + (unidad === 'frentes' ? ' activa' : '') + '" data-a="unidad" data-u="frentes">Caras</button>' +
      '<button class="opcion' + (unidad === 'cm' ? ' activa' : '') + '" data-a="unidad" data-u="cm">Centímetros</button>' +
    '</div>' +
    '<div class="lista-items">' + filas + '</div>' +
    '<div id="sosResultado">' + bloqueSosResultado() + '</div>' +
  '</div>';
}

/** El recuadro del share. Se redibuja solo mientras se escriben las medidas. */
function bloqueSosResultado() {
  var unidad = unidadVisita();
  var etiquetaUnidad = unidad === 'cm' ? 'cm' : 'caras';
  var r = calcularSos();
  var meta = S.config.metaSos;

  var resultado;
  var porCat = (r.categorias || []).filter(function (c) { return c.pct !== null; });
  var lineasCat = porCat.length > 1 || (porCat.length === 1 && (r.categorias || []).length > 1)
    ? '<div class="sos-cats">' + porCat.map(function (c) {
        return '<div class="sos-cat' + (c.pct < meta ? ' malo' : '') + '">' +
          '<span class="n">' + esc(c.nombre) + '</span>' +
          '<span class="p">' + c.pct + '%</span>' +
          '<span class="d">' + c.propio + ' de ' + c.total + ' ' + etiquetaUnidad + '</span>' +
        '</div>';
      }).join('') + '</div>'
    : '';
  if (r.pct === null) {
    resultado = '<div class="sos-resultado"><div class="sos-nota">' +
      'Mide el anaquel de cada categoría y reparte el espacio entre las marcas. El share se calcula solo.</div></div>';
  } else {
    var falta = Math.round((meta - r.pct) * 10) / 10;
    resultado = '' +
    '<div class="sos-resultado">' +
      '<div class="sos-cifra">' +
        '<div class="sos-num">' + r.pct + '%</div>' +
        '<div class="sos-meta">del anaquel es nuestro · meta ' + meta + '%</div>' +
      '</div>' +
      '<div class="sos-barra">' +
        '<i style="width:' + Math.min(100, r.pct) + '%"></i>' +
        '<div class="marca-meta" style="left:' + Math.min(100, meta) + '%"></div>' +
      '</div>' +
      lineasCat +
      '<div class="sos-nota' + (r.pct < meta ? ' malo' : '') + '">' +
        (r.pct >= meta
          ? 'Estamos en meta. Toma la foto del después para dejar constancia.'
          : 'Faltan ' + falta + ' puntos para la meta. Son unos ' +
            Math.ceil(r.total * meta / 100 - r.propio) + ' ' + etiquetaUnidad + ' más de exhibición.') +
        ' · total medido: ' + r.total + ' ' + etiquetaUnidad +
      '</div>' +
    '</div>';
  }
  return resultado;
}

/** Recuadro de quiebres bajo la lista; se refresca solo al cambiar cantidades. */

/** Botoncito Bs / $ al lado del precio. Con una sola moneda queda fijo. */
function monedaSelector(compId) {

function secPlanograma() {

/** Un cuadrito de foto: miniatura + botón. */
function celdaFoto(id, tag, obligatoria, extra) {
  var tomada = S.visita.fotos[id];
  var noHay = !tomada && !!(S.visita.fotosNoHay || {})[id];
  var fondo = tomada ? ' style="background-image:url(' + (tomada.thumb || tomada.dataUrl) + ')"' : '';
  return '' +
  '<div class="foto' + (noHay ? ' nohay' : '') + '">' +
    '<div class="foto-thumb' + (tomada ? ' hecha' : '') + '"' + fondo + '>' +
      '<span class="etq">' + esc(tag) + (tomada ? ' ✓' : noHay ? ' · no hay' : '') + '</span>' +
    '</div>' +
    '<button class="foto-btn" data-a="foto" data-f="' + esc(id) + '">' +
      (tomada ? 'Reemplazar' : 'Tomar foto') + '</button>' +
    (extra ? '<button class="foto-quitar" data-a="quitar-foto" data-f="' + esc(id) + '">Quitar</button>'
           : (tomada ? '' : '<button class="foto-quitar' + (noHay ? ' activa' : '') + '" data-a="foto-nohay" data-f="' + esc(id) + '">' +
               (noHay ? 'No hay ✓' : 'No hay') + '</button>')) +
  '</div>';
}

/** Cuadritos del catálogo agrupados por categoría (Facial, Corporal, Deo…). */
function fotosPorCategoria() {
  var grupos = [], porNombre = {};
  S.catalogos.fotos.forEach(function (f) {
    var cat = f.categoria || '';
    if (!porNombre[cat]) { porNombre[cat] = { nombre: cat, fotos: [] }; grupos.push(porNombre[cat]); }
    porNombre[cat].fotos.push(f);
  });
  return grupos.map(function (g) {
    return (g.nombre ? '<div class="foto-cat">' + esc(g.nombre) + '</div>' : '') +
      '<div class="fotos-grid">' +
        g.fotos.map(function (f) { return celdaFoto(f.id, f.tag, f.obligatoria, false); }).join('') +
      '</div>';
  }).join('');
}

/** Fotos libres que agrega el mercaderista (planograma u otras). */
function fotosExtra() {
  return Object.keys(S.visita.fotos)
    .filter(function (id) { return id.indexOf('X') === 0; })
    .sort(function (a, b) { return Number(a.slice(1)) - Number(b.slice(1)); });
}

function bloqueFotosExtra(titulo, sub) {
  var ids = fotosExtra();
  return '' +
  '<div class="tarjeta">' +
    '<div class="tarjeta-tit">' + titulo + '</div>' +
    '<div class="tarjeta-sub">' + sub + '</div>' +
    (ids.length ? '<div class="fotos-grid">' +
      ids.map(function (id) { return celdaFoto(id, S.visita.fotos[id].tag || 'extra', false, true); }).join('') +
      '</div>' : '') +
    '<button class="btn-contorno" data-a="agregar-foto">+ Agregar foto</button>' +
  '</div>';
}

function bloqueCierreNoEfectiva(c, r) {

    '</div>' +
    '<button class="btn-contorno" data-a="volver">Siguiente cliente</button>' +
  '</div>';
}

/* ============================= MI CARTERA ============================= */

function carteraFiltrada() {
  var d = S.miCarteraDatos;
  if (!d) return [];
  var f = S.filtrosMiCartera;
  var texto = normalizarBusqueda(f.texto);

  return d.clientes.filter(function (c) {
    if (f.region && c.region !== f.region) return false;
    if (f.ruta && c.ruta !== f.ruta) return false;
    if (f.dia !== '' && c.dias.indexOf(Number(f.dia)) < 0) return false;
    if (f.estado === 'incompletos' && c.completo) return false;
    if (f.estado === 'sin-gps' && c.tieneCoords) return false;
    if (f.estado === 'sin-dia' && c.dias.length) return false;
    if (texto) {
      var todo = normalizarBusqueda(
        [c.nombre, c.localidad, c.ubicacion, c.direccion, c.region].join(' '));
      if (todo.indexOf(texto) < 0) return false;
    }
    return true;
  });
}

function vistaMiCartera() {
  var d = S.miCarteraDatos;
  if (!d) return '<div class="ancho-1020"><div class="vacio">Cargando tu cartera…</div></div>';

  var r = d.resumen;
  var lista = carteraFiltrada();
  var f = S.filtrosMiCartera;

  var tarjetas = [
    { val: String(r.total), lab: 'Clientes', sub: 'en tu cartera' },
    { val: String(r.visitasSemana), lab: 'Visitas', sub: 'por semana' },
    { val: String(r.regiones), lab: 'Regiones', sub: r.localidades + ' localidades' },
    { val: String(r.incompletos), lab: 'Fichas', sub: r.incompletos ? 'incompletas' : 'todas completas',
      mal: r.incompletos > 0 }
  ];

  return '' +
  '<div class="ancho-1020">' +
    '<div class="fecha-hoy">' + esc(d.zona || 'tu cartera') + '</div>' +
    '<h1 class="titulo">Mis clientes</h1>' +
    '<div class="subtexto" style="margin-bottom:14px">Todos los que tienes asignados, ' +
      'con el día que le toca a cada uno.</div>' +

    '<div class="mini-kpis">' +
      tarjetas.map(function (t) {
        return '<div class="mini-kpi">' +
          '<div class="val"' + (t.mal ? ' style="color:#C4453B"' : '') + '>' + esc(t.val) + '</div>' +
          '<div class="lab">' + esc(t.lab) + '</div>' +
          '<div class="cmp neutro">' + esc(t.sub) + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +

    bloqueSemana(d) +
    bloqueRegiones(d) +

    '<div class="tarjeta-tit" style="margin:20px 0 10px">Buscar en tu cartera</div>' +
    '<div class="barra-herramientas">' +
      '<input class="buscador" id="buscadorCartera" placeholder="Buscar tienda, localidad o dirección…" ' +
             'value="' + esc(f.texto) + '">' +
      '<select class="filtro" data-a="filtro-cartera" data-f="region">' +
        '<option value="">Todas las regiones</option>' +
        d.regiones.map(function (x) {
          return '<option value="' + esc(x) + '"' + (f.region === x ? ' selected' : '') + '>' + esc(x) + '</option>';
        }).join('') +
      '</select>' +
      '<select class="filtro" data-a="filtro-cartera" data-f="dia">' +
        '<option value="">Cualquier día</option>' +
        d.porDia.map(function (x) {
          return '<option value="' + x.num + '"' + (String(f.dia) === String(x.num) ? ' selected' : '') + '>' +
                 esc(x.nombre) + ' (' + x.clientes + ')</option>';
        }).join('') +
      '</select>' +
      '<select class="filtro" data-a="filtro-cartera" data-f="estado">' +
        '<option value="">Todas las fichas</option>' +
        '<option value="incompletos"' + (f.estado === 'incompletos' ? ' selected' : '') + '>' +
          'Incompletas (' + r.incompletos + ')</option>' +
        '<option value="sin-gps"' + (f.estado === 'sin-gps' ? ' selected' : '') + '>' +
          'Sin punto GPS (' + r.sinCoords + ')</option>' +
        '<option value="sin-dia"' + (f.estado === 'sin-dia' ? ' selected' : '') + '>' +
          'Sin día asignado (' + r.sinDia + ')</option>' +
      '</select>' +
    '</div>' +

    '<div class="lista-items">' + tarjetasClientes(lista) + '</div>' +

    '<div class="subtexto" style="margin-top:12px">Mostrando ' + lista.length +
      ' de ' + r.total + ' clientes.</div>' +

    (r.sinCoords
      ? '<div class="aviso-sheets" style="margin-top:14px">' +
          '<div class="etq">GPS</div>' +
          '<div class="txt">' + r.sinCoords + ' cliente(s) todavía sin punto en el mapa. ' +
          'Se marca solo la primera vez que hagas check-in ahí.</div>' +
        '</div>'
      : '') +
  '</div>';
}

/** Cuántos clientes toca cada día de la semana. */
function bloqueSemana(d) {
  var max = Math.max.apply(null, d.porDia.map(function (x) { return x.clientes; }).concat([1]));

  return '' +
  '<div class="tarjeta" style="margin-top:13px">' +
    '<div class="tarjeta-tit">Tu semana</div>' +
    '<div class="tarjeta-sub">Clientes que te tocan cada día.' +
      (d.resumen.sinDia ? ' ' + d.resumen.sinDia + ' sin día asignado.' : '') + '</div>' +
    '<div class="grafico" style="height:120px">' +
      d.porDia.map(function (x) {
        return '<div class="barra-col">' +
          '<div class="v">' + x.clientes + '</div>' +
          '<div class="barra' + (x.esHoy ? ' alta' : '') + '" ' +
            'style="height:' + Math.max(3, Math.round(x.clientes / max * 78)) + 'px"></div>' +
          '<div class="d"' + (x.esHoy ? ' style="color:#123C7E;font-weight:800"' : '') + '>' +
            esc(x.dia) + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';
}

function bloqueRegiones(d) {
  if (!d.porRegion.length) return '';

  return '' +
  '<div class="tarjeta" style="margin-top:12px">' +
    '<div class="tarjeta-tit">Por región</div>' +
    '<div class="tarjeta-sub">Cómo se reparte tu cartera.</div>' +
    '<div class="tabla-scroll"><table class="tabla">' +
      '<tr><th>Región</th><th style="text-align:right">Clientes</th>' +

function bloqueNota(d) {
  if (d.nota.sinDatos) {
    return '<div class="nota-dia"><div class="fila">' +
      '<div class="nota-circulo"><div><div class="n">—</div></div></div>' +
      '<div class="flex1">' +
        '<div class="nota-etiqueta">Sin visitas todavía</div>' +
        '<div class="nota-sub">Tu nota del día aparece cuando cierras la primera visita.</div>' +
      '</div></div></div>';
  }

  var barras = d.nota.partes.map(function (p) {
    return '<div class="nota-item">' +
      '<div class="lab">' + esc(p.label) + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(p.puntos / p.max * 100) + '%"></i></div>' +
      '<div class="pts">' + p.puntos + '/' + p.max + '</div>' +
    '</div>' +
    '<div class="nota-item"><div class="lab"></div><div class="txt">' + esc(p.texto) + '</div></div>';
  }).join('');

  return '' +
  '<div class="nota-dia">' +
    '<div class="fila">' +
      '<div class="nota-circulo">' +

          '<div class="de">DE 100</div>' +

          'cuánto tiempo trabajaste cada tienda, la evidencia que dejaste, ' +
          'lo completo de tus datos y si hiciste check-in en el punto.</div>' +
      '</div>' +
    '</div>' +
    '<div class="nota-detalle">' + barras + '</div>' +
  '</div>';
}

function bloqueMisNumeros(d) {
  var r = d.resumen, c = d.comparativo;

  function comparar(actual, referencia, sufijo, masEsMejor) {
    if (referencia === null || referencia === undefined || actual === null) {
      return { clase: 'neutro', texto: 'sin histórico' };
    }
    var dif = Math.round((actual - referencia) * 10) / 10;
    if (dif === 0) return { clase: 'neutro', texto: 'igual a tu promedio' };
    var mejor = masEsMejor ? dif > 0 : dif < 0;
    return {
      clase: mejor ? '' : 'baja',
      texto: (dif > 0 ? '+' : '−') + Math.abs(dif) + ' ' + sufijo + ' vs tu promedio'
    };
  }

  var cVisitas = comparar(r.hechas, c.visitasPorDia, '', true);
  var cTiempo  = comparar(r.minutosPromedio, c.minutosPromedio, 'min', true);
  var cSos     = comparar(r.sos, c.sos, 'pts', true);

  var tarjetas = [
    { val: r.hechas + (r.planificadas ? '/' + r.planificadas : ''), lab: 'Visitas', cmp: cVisitas },
    { val: r.tiempoPromedio, lab: 'Prom. por tienda', cmp: cTiempo },
    { val: r.sos === null ? '—' : r.sos + '%', lab: 'Share of shelf', cmp: cSos },
    { val: String(r.quiebres), lab: 'Quiebres', cmp: { clase: 'neutro', texto: 'encontrados hoy' } },
    { val: String(r.fotos), lab: 'Fotos', cmp: { clase: 'neutro', texto: 'subidas' } },
    { val: String(r.incidencias), lab: 'Incidencias', cmp: { clase: 'neutro', texto: 'reportadas' } }
  ];

  return '<div class="mini-kpis">' + tarjetas.map(function (t) {
    return '<div class="mini-kpi">' +
      '<div class="val">' + esc(t.val) + '</div>' +
      '<div class="lab">' + esc(t.lab) + '</div>' +
      '<div class="cmp ' + t.cmp.clase + '">' + esc(t.cmp.texto) + '</div>' +
    '</div>';
  }).join('') + '</div>' +
  (c.diasConDatos < 3
    ? '<div class="subtexto" style="margin-top:9px">Llevas ' + c.diasConDatos +
      ' día(s) con datos. Las comparaciones se afinan a partir del tercer día de uso.</div>'
    : '');
}

function bloqueRecomendaciones(d) {
  if (!d.recomendaciones.length) return '';
  var iconos = { alerta: '!', accion: '→', mejora: '↑', logro: '✓', info: 'i' };

  return '' +
  '<div style="margin-top:20px">' +
    '<div class="tarjeta-tit" style="margin-bottom:10px">Qué conviene hacer</div>' +
    '<div class="lista-items">' +
      d.recomendaciones.map(function (r) {
        return '<div class="reco ' + r.tipo + '">' +
          '<div class="ico">' + (iconos[r.tipo] || 'i') + '</div>' +
          '<div class="flex1">' +
            '<div class="tit">' + esc(r.titulo) + '</div>' +
            '<div class="txt">' + esc(r.texto) + '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';
}

function bloquePlanManana(d) {
  var m = d.manana;

  var filas = m.clientes.length ? m.clientes.map(function (c) {
    var nivel = c.prioridad >= 60 ? '' : c.prioridad >= 30 ? ' media' : ' baja';
    var texto = c.prioridad >= 60 ? 'Urgente' : c.prioridad >= 30 ? 'Importante' : 'Normal';
    return '<div class="plan-fila">' +
      '<div class="plan-hora">' + esc(c.hora) + '</div>' +
      '<div class="flex1">' +
        '<div class="item-nombre">' + esc(c.nombre) + '</div>' +
        '<div class="plan-motivo">' + esc(c.motivo) + '</div>' +
      '</div>' +
      (m.yaPlanificado ? '' : '<div class="prioridad' + nivel + '">' + texto + '</div>') +
    '</div>';
  }).join('') : '<div class="vacio">Todavía no hay suficiente historial para proponerte una ruta. ' +
                'Se arma sola cuando lleves unos días registrando visitas.</div>';

  var boton = (!m.yaPlanificado && m.clientes.length)
    ? '<button class="btn-oro-ancho" data-a="guardar-plan"' + (S.guardandoPlan ? ' disabled' : '') + '>' +
        (S.guardandoPlan ? 'Guardando…' : 'Guardar este plan para mañana') + '</button>' +
      '<div class="destino">se escribe en la hoja de rutas · puedes ajustarlo después</div>'
    : (m.yaPlanificado
        ? '<div class="destino" style="margin-top:13px">tu ruta de mañana ya está cargada por el administrador</div>'
        : '');

  return '' +
  '<div style="margin-top:20px">' +
    '<div class="tarjeta-tit">Mañana · ' + esc(m.fechaLarga) + '</div>' +
    '<div class="tarjeta-sub">' +
      (m.yaPlanificado
        ? 'Esta es la ruta que ya tienes asignada.'
        : 'Propuesta armada con lo que encontraste en calle: primero lo que quedó pendiente, ' +
          'los quiebres y las tiendas donde perdemos espacio.') +
    '</div>' +
    '<div class="tarjeta">' +
      '<div class="lista-items">' + filas + '</div>' +
      boton +
    '</div>' +
  '</div>';
}

           n + ' días</button>';

  return '' +
  '<div class="ancho-1180">' +

        '<h1 class="titulo">Análisis</h1>' +

    '<div class="tira-indicadores">' +

function bloqueEspacioAnalisis(d) {
  var e = d.espacio;
  if (e.promedio === null) {
    return '<div class="tarjeta" style="margin-top:12px">' +
      '<div class="tarjeta-tit">Share of shelf</div>' +
      '<div class="tarjeta-sub" style="margin:0">Todavía no hay mediciones de anaquel en el periodo. ' +
      'Pide a los mercaderistas que llenen la sección Espacio en cada visita.</div></div>';
  }

  var max = Math.max.apply(null, e.tendencia.map(function (t) { return t.valor || 0; }).concat([e.meta]));
  var spark = e.tendencia.map(function (t) {
    return '<div class="b' + (t.valor === null ? ' vacio' : '') + '" ' +
           'style="height:' + (t.valor === null ? 4 : Math.max(4, Math.round(t.valor / max * 54))) + 'px" ' +
           'title="' + esc(t.fecha + ' · ' + (t.valor === null ? 'sin datos' : t.valor + '%')) + '"></div>';
  }).join('');

  var reparto = e.reparto.map(function (r) {
    return '<tr>' +
      '<td>' + esc(r.marca) + (r.tipo === 'propia' ? ' <span class="chip chip-oro">nuestra</span>' : '') + '</td>' +
      '<td style="width:45%"><div class="barra-mini"><i class="' + (r.tipo === 'propia' ? 'alto' : '') +
        '" style="width:' + Math.min(100, r.share) + '%"></i></div></td>' +
      '<td class="num">' + r.share + '%</td>' +
    '</tr>';
  }).join('');

  var peores = e.peores.map(function (c) {
    return '<tr>' +
      '<td>' + esc(c.cliente) + '<div class="tenue">' + esc(c.zona) + '</div></td>' +
      '<td class="num" style="color:' + (c.valor < e.meta ? '#C4453B' : '#1E7A45') + '">' + c.valor + '%</td>' +
      '<td class="num tenue">' + c.visitas + '</td>' +
    '</tr>';
  }).join('');

  var zonas = e.porZona.map(function (z) {
    return '<tr>' +
      '<td>' + esc(z.clave) + '</td>' +
      '<td style="width:45%"><div class="barra-mini"><i class="' + (z.valor >= e.meta ? 'alto' : 'bajo') +
        '" style="width:' + Math.min(100, z.valor / Math.max(e.meta, 1) * 100) + '%"></i></div></td>' +
      '<td class="num">' + z.valor + '%</td>' +
      '<td class="num tenue">' + z.visitas + '</td>' +
    '</tr>';
  }).join('');

  return '' +
  '<div class="panel-grid">' +
    '<div class="tarjeta">' +
      '<div class="tarjeta-tit">Cómo se reparte el anaquel</div>' +
      '<div class="tarjeta-sub">Promedio de todas las tiendas medidas en el periodo.</div>' +
      '<div class="sos-cifra" style="margin-bottom:12px">' +
        '<div class="sos-num">' + e.promedio + '%</div>' +
        '<div class="sos-meta">nuestro · meta ' + e.meta + '%' +
          (e.previo !== null ? ' · periodo anterior ' + e.previo + '%' : '') + '</div>' +
      '</div>' +
      '<div class="tabla-scroll"><table class="tabla">' + reparto + '</table></div>' +
      '<div class="tarjeta-sub" style="margin:16px 0 6px">Evolución diaria</div>' +
      '<div class="sparkline">' + spark + '</div>' +
    '</div>' +
    '<div class="tarjeta">' +
      '<div class="tarjeta-tit">Dónde perdemos espacio</div>' +
      '<div class="tarjeta-sub">Las tiendas con menor share. Son las de mayor retorno si se negocian.</div>' +
      '<div class="tabla-scroll"><table class="tabla">' +
        '<tr><th>Cliente</th><th style="text-align:right">Share</th><th style="text-align:right">Visitas</th></tr>' +
        peores + '</table></div>' +
      '<div class="tarjeta-sub" style="margin:16px 0 6px">Por zona</div>' +
      '<div class="tabla-scroll"><table class="tabla">' + zonas + '</table></div>' +
    '</div>' +
  '</div>';
}

          '<td class="num">' + (c.dias === null ? 'nunca' : c.dias + ' d') + '</td>' +

      '<div class="tarjeta-sub">Tasa de quiebre por SKU sobre todas las mediciones.</div>' +

        porSku + '</table></div>' +
      '<div class="tarjeta-sub" style="margin:16px 0 6px">Quiebres que se repiten</div>' +

    '<div class="tarjeta">' +
      '<div class="tarjeta-tit">Clientes en riesgo</div>' +

        '<tr><th>Cliente</th><th style="text-align:right">Sin visita</th></tr>' + riesgo + '</table></div>' +
    '</div>' +
  '</div>';
}

function bloqueMercadoEquipo(d) {
  var marcas = d.precios.marcas.length
    ? d.precios.marcas.map(function (m) {
        var color = m.brecha === null ? 'inherit' : (m.brecha < 0 ? '#C4453B' : '#1E7A45');
        return '<tr>' +

          '<td class="num">' + esc(m.moneda || S.config.moneda) + ' ' + m.promedio + '</td>' +
          '<td class="num" style="color:' + color + '">' +
            (m.brecha === null ? '—' : (m.brecha > 0 ? '+' : '') + m.brecha + '%') + '</td>' +
        '</tr>';
      }).join('')
    : '<tr><td class="tenue">Sin precios capturados en el periodo.</td></tr>';

  var plano = d.planograma.length
    ? d.planograma.map(function (p) {
        return '<tr>' +
          '<td>' + esc(p.pregunta) + '</td>' +
          '<td style="width:35%"><div class="barra-mini"><i class="' + (p.pctNo > 25 ? 'bajo' : 'alto') +
            '" style="width:' + Math.round(p.si / p.total * 100) + '%"></i></div></td>' +
          '<td class="num">' + Math.round(p.si / p.total * 100) + '%</td>' +
        '</tr>';
      }).join('')
    : '<tr><td class="tenue">Sin encuestas en el periodo.</td></tr>';

  var equipo = d.equipo.map(function (e) {
    return '<tr>' +
      '<td>' + esc(e.nombre) + '<div class="tenue">' + esc(e.zona) + '</div></td>' +

  if (!d) return COLORES_MERC[0];
  var i = d.filas.map(function (f) { return f.usuarioId; }).indexOf(usuarioId);

function etiquetaEstado(e) {
  return e === 'en-ruta' ? 'En ruta'
       : e === 'terminado' ? 'Terminó'
       : e === 'sin-checkin' ? 'Sin abrir'
       : e === 'sin-senal' ? 'Sin señal'
       : 'Sin ruta';
}

function haceCuanto(min) {
  if (min < 60) return min + ' min';
  var h = Math.floor(min / 60);
  var m = min % 60;
  return h + 'h' + (m ? ' ' + m + 'm' : '');
}

function recortar(t, n) {
  t = String(t || '');
  return t.length > n ? t.slice(0, n - 1) + '…' : t;
}

/* ------------------- El mapa geográfico (Leaflet) ------------------- */

var _mapa = null;
var _vistaMapa = null;      // centro y zoom que el administrador dejó puestos

/** Antes de rehacer la pantalla se guarda cómo estaba mirando el mapa. */
function desmontarMapa() {
  if (!_mapa) return;
  try {
    _vistaMapa = { centro: _mapa.getCenter(), zoom: _mapa.getZoom() };
    _mapa.remove();
  } catch (e) { /* el contenedor ya no existe */ }
  _mapa = null;
}

/** Dibuja el mapa después de cada render, si la pantalla lo incluye. */
function montarMapa() {
  var cont = document.getElementById('mapaGeo');
  if (!cont || !S.monitorDatos || !S.monitorDatos.mapa.hay) return;

  if (typeof L === 'undefined') {
    cont.innerHTML = '<div class="mapa-sin-red">No se pudo cargar el mapa.<br>' +
      'Revisa la conexión: las imágenes del mapa se descargan de OpenStreetMap.</div>';
    return;
  }

  var m = S.monitorDatos.mapa;

  _mapa = L.map(cont, { zoomControl: true, attributionControl: true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; colaboradores de OpenStreetMap'
  }).addTo(_mapa);

  var limites = [];

  m.mercaderistas.forEach(function (x) {
    if (S.mercOculto[x.usuarioId]) return;
    var color = colorMerc(x.usuarioId);

    // El polígono de cobertura, debajo de todo.
    if (x.poligono.length >= 3) {
      L.polygon(x.poligono.map(function (p) { return [p.lat, p.lng]; }), {
        color: color, weight: 2, opacity: 0.8, fillColor: color, fillOpacity: 0.12
      }).addTo(_mapa).bindTooltip(x.nombre + ' · ' + x.areaKm2 + ' km² cubiertos');
    }

    // El recorrido, en el orden en que fue cerrando visitas.
    if (x.puntos.length >= 2) {
      L.polyline(x.puntos.map(function (p) { return [p.lat, p.lng]; }), {
        color: color, weight: 2.5, opacity: 0.75, dashArray: '6 6'
      }).addTo(_mapa);
    }

    // Un punto por check-in.
    x.puntos.forEach(function (p) {
      limites.push([p.lat, p.lng]);

      L.circleMarker([p.lat, p.lng], {
        radius: 11,
        color: p.ok ? color : '#F5837C',
        weight: 2.5,
        fillColor: p.ok ? color : '#F5837C',
        fillOpacity: 0.85
      }).addTo(_mapa).bindPopup(
        '<b>' + esc(p.cliente) + '</b><br>' +
        '<span class="meta">' + esc(x.nombre) + ' · check-in ' + esc(p.hora) +
        (p.ok ? '' : ' · <strong>fuera de geocerca</strong>') + '<br>' +
        p.lat.toFixed(5) + ', ' + p.lng.toFixed(5) + '</span><br>' +
        '<a href="https://www.google.com/maps?q=' + p.lat + ',' + p.lng +
        '" target="_blank" rel="noopener">Abrir en Google Maps</a>'
      );

      L.marker([p.lat, p.lng], {
        interactive: false,
        icon: L.divIcon({ className: 'marca-orden', html: String(p.orden), iconSize: [18, 18] })
      }).addTo(_mapa);
    });
  });

  // Se respeta el encuadre que el administrador haya elegido a mano.
  if (_vistaMapa) {
    _mapa.setView(_vistaMapa.centro, _vistaMapa.zoom);
  } else if (limites.length > 1) {
    _mapa.fitBounds(limites, { padding: [34, 34] });
  } else if (limites.length === 1) {
    _mapa.setView(limites[0], 15);
  } else {
    _mapa.setView([m.centro.lat, m.centro.lng], 13);
  }

  _mapa.on('moveend zoomend', function () {
    _vistaMapa = { centro: _mapa.getCenter(), zoom: _mapa.getZoom() };
  });
}

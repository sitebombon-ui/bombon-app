<script>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   JS_Acciones — qué pasa cuando el usuario toca algo.
   =================================================================== */

/* ====================== ESCUCHA DE EVENTOS ====================== */

/* Acciones que atiende este archivo. Las demás (pantalla de cartera) las
   maneja JS_CarteraAcciones, así que aquí se dejan pasar sin tocarlas:
   si se llamara preventDefault sobre ellas, las casillas no se marcarían. */
var ACCIONES_ = ['rellenar', 'ir', 'salir', 'abrir', 'volver', 'checkin', 'seccion',
                 'mas', 'menos', 'resp', 'foto', 'tag', 'checkout', 'sincronizar',
                 'exportar', 'guardar-plan', 'periodo', 'exportar-analisis',
                 'checkin-nota', 'abrir-cierre-rapido', 'cancelar-cierre-rapido',
                 'motivo', 'cierre-rapido', 'moneda', 'unidad', 'precio-nm', 'agregar-foto', 'quitar-foto', 'foto-nohay'];

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el || el.tagName === 'FORM') return;
  var a = el.getAttribute('data-a');
  if (a === 'entrar') return;                 // lo maneja el submit del formulario
  if (ACCIONES_.indexOf(a) < 0) return;       // no es de esta pantalla
  ev.preventDefault();

  switch (a) {
    case 'rellenar':    rellenarUsuario(el.getAttribute('data-u')); break;
    case 'ir':          irA(el.getAttribute('data-v')); break;
    case 'salir':       salir(); break;
    case 'abrir':       abrirCliente(el.getAttribute('data-c')); break;
    case 'volver':      volverARuta(); break;
    case 'checkin':     hacerCheckin(el); break;
    case 'seccion':     S.seccion = el.getAttribute('data-s'); guardarVisitaEnCurso(); render(); break;
    case 'mas':         cambiarStock(el.getAttribute('data-k'), 1); break;
    case 'menos':       cambiarStock(el.getAttribute('data-k'), -1); break;
    case 'resp':        responder(el.getAttribute('data-q'), el.getAttribute('data-o')); break;
    case 'foto':        pedirFoto(el.getAttribute('data-f')); break;
    case 'agregar-foto': agregarFotoExtra(); break;
    case 'quitar-foto': delete S.visita.fotos[el.getAttribute('data-f')]; guardarVisitaEnCurso(); render(); break;
    case 'foto-nohay':  alternarFotoNoHay(el.getAttribute('data-f')); break;
    case 'tag':         alternarEtiqueta(el.getAttribute('data-t')); break;
    case 'checkout':    hacerCheckout(); break;
    case 'checkin-nota': hacerCheckin(el, true); break;
    case 'abrir-cierre-rapido':    S.cierreRapido = true; render(); break;
    case 'cancelar-cierre-rapido': S.cierreRapido = false; render(); break;
    case 'motivo':      S.visita.motivoCierre = el.getAttribute('data-m'); guardarVisitaEnCurso(); render(); break;
    case 'cierre-rapido': hacerCierreRapido(); break;
    case 'moneda':      cambiarMoneda(el.getAttribute('data-k'), el); break;
    case 'precio-nm':   alternarNoMostrado(el.getAttribute('data-k')); break;
    case 'unidad':      S.visita.unidadEspacio = el.getAttribute('data-u'); guardarVisitaEnCurso(); render(); break;
    case 'sincronizar': subirCola(false); break;
    case 'exportar':    exportar(); break;
    case 'guardar-plan': guardarPlan(); break;
    case 'periodo':     cambiarPeriodo(Number(el.getAttribute('data-d'))); break;
    case 'exportar-analisis': exportarAnalisis(); break;
  }
});

document.addEventListener('submit', function (ev) {
  if (ev.target.getAttribute('data-a') === 'entrar') { ev.preventDefault(); entrar(); }
});

/* Los campos de texto actualizan el estado sin volver a dibujar la pantalla,
   para no perder el cursor mientras se escribe. */
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.hasAttribute && t.hasAttribute('data-precio') && S.visita) {
    var kp = t.getAttribute('data-precio');
    S.visita.precios[kp] = t.value.replace(',', '.');
    if (t.value.trim() && S.visita.preciosNoMostrados && S.visita.preciosNoMostrados[kp]) {
      delete S.visita.preciosNoMostrados[kp];
      var b = document.querySelector('[data-a="precio-nm"][data-k="' + kp + '"]');
      if (b) b.classList.remove('activa');
    }
    guardarVisitaEnCurso();
  }
  if (t.hasAttribute && t.hasAttribute('data-espacio') && S.visita) {
    var marca = t.getAttribute('data-espacio');
    var unidad = t.getAttribute('data-u');
    if (!S.visita.espacio[marca]) S.visita.espacio[marca] = {};
    S.visita.espacio[marca][unidad] = t.value === '' ? '' : Math.max(0, Number(t.value) || 0);
    guardarVisitaEnCurso();
    // Solo se redibuja el recuadro del share, para no perder el cursor.
    var caja = document.getElementById('sosResultado');
    if (caja) caja.innerHTML = bloqueSosResultado();
  }
  if (t.id === 'nota' && S.visita) {
    S.visita.nota = t.value;
    guardarVisitaEnCurso();
  }
  if (t.hasAttribute && t.hasAttribute('data-stock') && S.visita) {
    var ks = t.getAttribute('data-stock');
    var limpio = t.value.replace(/\D/g, '');
    if (limpio !== t.value) t.value = limpio;
    S.visita.inventario[ks] = limpio === '' ? 0 : Math.min(99999, Number(limpio));
    if (!S.visita.inventarioTocado) S.visita.inventarioTocado = {};
    S.visita.inventarioTocado[ks] = true;
    guardarVisitaEnCurso();
    var avisoInv = document.getElementById('avisoInventario');
    if (avisoInv) avisoInv.outerHTML = avisoInventario();
  }
  if (t.id === 'obs-fotos' && S.visita) {
    S.visita.obsFotos = t.value;
    guardarVisitaEnCurso();
  }
});

/* Al salir de la casilla de cantidad, un vacío vuelve a mostrarse como 0. */
document.addEventListener('focusout', function (ev) {
  var t = ev.target;
  if (t && t.hasAttribute && t.hasAttribute('data-stock') && t.value === '') t.value = '0';
});

/* ======================== INICIO DE SESIÓN ======================== */

function rellenarUsuario(u) {
  var campo = document.getElementById('usuario');
  campo.value = u;
  document.getElementById('pin').focus();
}

function entrar() {
  var usuario = document.getElementById('usuario').value.trim();
  var pin = document.getElementById('pin').value.trim();
  var caja = document.getElementById('errorLogin');
  caja.innerHTML = '';

  if (!usuario || !pin) {
    caja.innerHTML = '<div class="error-login">Escribe tu usuario y tu PIN.</div>';
    return;
  }

  cargando(true);
  var entrada = api('apiLogin', usuario, pin)
    .then(function (d) {
      // Se guarda la huella para poder entrar sin señal la próxima vez.
      if (d.perfil && d.perfil.rol !== 'admin') {
        huellaAcceso(usuario, pin).then(function (h) {
          guardarBd(LS.ACCESO, { usuario: usuario.toLowerCase(), huella: h, sesion: d, guardadoEn: Date.now() });
        });
      }
      return d;
    })
    .catch(function (e) {
      if (!(e && e.sinConexion)) throw e;
      // Sin señal: se acepta el acceso si coincide con el último correcto en este teléfono.
      return Promise.all([leerBd(LS.ACCESO), huellaAcceso(usuario, pin)]).then(function (r) {
        var guardado = r[0];
        if (guardado && guardado.usuario === usuario.toLowerCase() && guardado.huella === r[1] && guardado.sesion) {
          setTimeout(function () { aviso('Sin conexión: entraste con los datos guardados en este teléfono.'); }, 700);
          _sesionRespaldo = { token: guardado.sesion.token, perfil: guardado.sesion.perfil, catalogos: guardado.sesion.catalogos, config: guardado.sesion.config };
          return guardado.sesion;
        }
        // Con internet y aun así "sin conexión": el servidor no respondió como se esperaba.
        if (navigator.onLine) {
          throw new Error('No se pudo hablar con el servidor: ' + e.message +
            ' Revisa que Apps Script tenga la versión ' + VERSION_APP + ' implementada (abre la URL /exec?ping=1: debe responder "doPost": true) ' +
            'y que config.js apunte a esa misma URL.');
        }
        throw new Error('Sin conexión. Para entrar sin señal, este usuario debe haber entrado antes desde este teléfono con señal.');
      });
    });

  entrada
    .then(function (d) {
      aplicarSesion(d);
      recuperarVisitaEnCurso();
      return leerBd(LS.RUTA).then(function (r) { _rutaRespaldo = r; return cargarVista(); });
    })
    .then(function () { cargando(false); render(); })
    .catch(function (e) {
      cargando(false);
      render();
      var c = document.getElementById('errorLogin');
      if (c) c.innerHTML = '<div class="error-login">' + esc(e.message) + '</div>';
      var cu = document.getElementById('usuario');
      if (cu) cu.value = usuario;
    });
}

function salir() {
  if (S.cola.length && !confirm('Tienes ' + S.cola.length + ' visita(s) sin subir. ' +
      'Si sales seguirán guardadas en este teléfono. ¿Salir igual?')) return;
  var token = S.token;
  cerrarSesionLocal();
  if (token && navigator.onLine) api('apiSalir', token).catch(function () {});
}

/* ============================ VISITA ============================ */

function nuevaVisita(cliente) {
  var inv = {};
  S.catalogos.skus.forEach(function (s) { inv[s.id] = 0; });
  var esp = {};
  S.catalogos.espacio.forEach(function (m) { esp[m.id] = {}; });
  return {
    visitaId: uuid(),
    clienteId: cliente.clienteId,
    clienteNombre: cliente.nombre,
    fecha: fechaISOLocal(),
    inicioMs: null,
    checkin: {},
    checkout: {},
    inventario: inv,
    inventarioTocado: {},
    precios: {},
    monedas: {},
    preciosNoMostrados: {},
    fotosNoHay: {},
    obsFotos: '',
    unidadEspacio: S.config.unidadEspacio || 'frentes',
    motivoCierre: '',
    espacio: esp,
    categoria: S.config.categoria,
    respuestas: {},
    etiquetas: [],
    nota: '',
    fotos: {},
    creadoEn: selloLocal()
  };
}

function abrirCliente(clienteId) {
  var c = rutaConEstado().filter(function (x) { return x.clienteId === clienteId; })[0];
  if (!c) return;

  if (c.completada) {
    // Visita ya registrada: se muestra el resumen, no se puede volver a capturar.
    var enCola = S.cola.filter(function (p) { return p.clienteId === clienteId; })[0];
    S.visita = {
      clienteId: clienteId, clienteNombre: c.nombre, inicioMs: null,
      espacio: (enCola && enCola.espacio) || {},
      unidadEspacio: (enCola && enCola.unidadEspacio) || ''
    };
    S.cierre = enCola
      ? { duracionSeg: enCola.duracionSeg, fotos: (enCola.fotos || []).length,
          quiebres: contarQuiebres(enCola.inventario), sos: calcularSos().pct, subida: false,
          efectiva: enCola.efectiva !== false, motivoCierre: enCola.motivoCierre || '', nota: enCola.nota || '' }
      : { duracionSeg: segundosDeTexto(c.duracion), fotos: 0, quiebres: 0, sos: null, subida: true,
          efectiva: c.efectiva !== false, motivoCierre: c.motivoCierre || '', nota: '' };
    S.fase = 'fin';
  } else {
    S.visita = nuevaVisita(c);
    S.fase = 'checkin';
    S.seccion = 'inv';
    S.cierre = null;
    S.cierreRapido = false;
  }

  S.vista = 'visita';
  render();
}

function volverARuta() {
  if (S.fase === 'form' && !confirm('La visita está a medio llenar. Se guardará en este teléfono ' +
      'y podrás continuarla. ¿Volver a la ruta?')) return;
  if (S.fase !== 'form') borrarLocal(LS.VISITA);
  S.vista = 'ruta';
  if (S.fase !== 'form') { S.visita = null; S.fase = 'checkin'; S.cierre = null; }
  pararCronometro();
  render();
  cargarVista().then(render);
}

/* ---------------------------- CHECK-IN ---------------------------- */

function hacerCheckin(boton, soloNota) {
  var c = clienteActual();
  var textoOriginal = boton.textContent;
  boton.disabled = true;
  boton.textContent = 'Buscando señal GPS…';

  ubicacion()
    .then(function (pos) {
      var dist = (c.lat && c.lng) ? distanciaMetros(pos.lat, pos.lng, c.lat, c.lng) : null;
      var dentro = dist === null ? null : dist <= (c.geocerca || S.config.geocerca);

      // Para cerrar solo con nota no se exige estar dentro de la geocerca:
      // justamente puede ser que no se pudo llegar hasta el local.
      if (dentro === false && S.config.exigirGeocerca && !soloNota) {
        throw new Error('Estás a ' + dist + ' m del cliente y la geocerca es de ' +
                        (c.geocerca || S.config.geocerca) + ' m. Acércate para hacer el check-in.');
      }

      iniciarFormulario({
        hora: horaHM(), lat: pos.lat, lng: pos.lng,
        precision: pos.precision, distancia: dist, enGeocerca: dentro
      }, soloNota);
    })
    .catch(function (e) {
      boton.disabled = false;
      boton.textContent = textoOriginal;
      if (e && e.sinPermiso) {
        if (confirm('No se pudo obtener el GPS (' + e.message + ').\n\n' +
                    '¿Registrar la llegada sin coordenadas? Quedará marcado como "sin GPS".')) {
          iniciarFormulario({ hora: horaHM(), lat: '', lng: '', precision: '', enGeocerca: null }, soloNota);
        }
      } else {
        aviso(e.message, true);
      }
    });
}

function iniciarFormulario(checkin, soloNota) {
  S.visita.checkin = checkin;
  S.visita.inicioMs = Date.now();
  S.fase = 'form';
  S.seccion = 'inv';
  S.cierreRapido = !!soloNota;
  guardarVisitaEnCurso();
  mantenerPantalla();
  render();
  aviso('Check-in registrado a las ' + checkin.hora);
}

/* --------------------- CIERRE RÁPIDO (NO EFECTIVA) --------------------- */

/**
 * Cierra la visita sin capturar nada: solo motivo y nota (obligatoria).
 * No pasa por las validaciones de obligatorios; el servidor la marca
 * efectiva = NO y no la cuenta como cumplimiento.
 */
function hacerCierreRapido() {
  var nota = String(S.visita.nota || '').trim();
  if (!S.visita.motivoCierre) { aviso('Elige el motivo por el que no se pudo hacer la visita.', true); return; }
  if (nota.length < 5) {
    aviso('La nota es obligatoria: cuenta brevemente qué pasó.', true);
    var t = document.getElementById('nota');
    if (t) t.focus();
    return;
  }

  var duracion = segundosVisita();
  var payload = {
    visitaId: S.visita.visitaId,
    clienteId: S.visita.clienteId,
    clienteNombre: S.visita.clienteNombre,
    fecha: S.visita.fecha,
    checkin: S.visita.checkin,
    checkout: { hora: horaHM(), lat: '', lng: '' },
    duracionSeg: duracion,
    efectiva: false,
    motivoCierre: S.visita.motivoCierre,
    inventario: {}, precios: {}, monedas: {}, espacio: {},
    categoria: S.visita.categoria,
    respuestas: {},
    etiquetas: S.visita.etiquetas || [],
    nota: nota,
    fotos: [],
    creadoEn: S.visita.creadoEn
  };

  S.cola.push(payload);
  var colaLista = guardarCola();
  borrarLocal(LS.VISITA);

  S.cierre = {
    visitaId: payload.visitaId,
    duracionSeg: duracion, fotos: 0, quiebres: 0, sos: null, subida: false,
    efectiva: false, motivoCierre: S.visita.motivoCierre, nota: nota
  };
  S.fase = 'fin';
  S.cierreRapido = false;
  pararCronometro();
  soltarPantalla();
  render();

  // Primero que la cola quede en disco; si la pestaña se cae a mitad de la
  // subida, la visita reaparece como "por subir" y no se pierde.
  Promise.resolve(colaLista).then(function () { subirCola(true); });
}

/* ------------------------------ MONEDA ------------------------------ */

/** Marca o desmarca "no hay" en un cuadrito de foto (sin material, sin exhibición…). */
function alternarFotoNoHay(fotoId) {
  if (!S.visita.fotosNoHay) S.visita.fotosNoHay = {};
  if (S.visita.fotosNoHay[fotoId]) delete S.visita.fotosNoHay[fotoId];
  else S.visita.fotosNoHay[fotoId] = true;
  guardarVisitaEnCurso();
  render();
}

/** Marca o desmarca "precio no mostrado" en una línea; al marcar se limpia el monto. */
function alternarNoMostrado(compId) {
  if (!S.visita.preciosNoMostrados) S.visita.preciosNoMostrados = {};
  if (S.visita.preciosNoMostrados[compId]) delete S.visita.preciosNoMostrados[compId];
  else { S.visita.preciosNoMostrados[compId] = true; S.visita.precios[compId] = ''; }
  guardarVisitaEnCurso();
  render();
}

/** Alterna Bs → $ → Bs en una línea de precio. */
function cambiarMoneda(compId, boton) {
  var monedas = S.config.monedas || [S.config.moneda];
  if (!S.visita.monedas) S.visita.monedas = {};
  var actual = S.visita.monedas[compId] || S.config.moneda;
  var i = monedas.indexOf(actual);
  var nueva = monedas[(i + 1) % monedas.length];
  S.visita.monedas[compId] = nueva;
  guardarVisitaEnCurso();
  // Solo se cambia el texto del botón para no perder el cursor del precio.
  if (boton) boton.textContent = nueva;
}

/** GPS del navegador, con aviso claro si el permiso está bloqueado. */
function ubicacion() {
  return new Promise(function (resolve, reject) {
    if (!navigator.geolocation) {
      var e0 = new Error('este navegador no ofrece ubicación');
      e0.sinPermiso = true; return reject(e0);
    }
    navigator.geolocation.getCurrentPosition(
      function (p) {
        resolve({ lat: p.coords.latitude, lng: p.coords.longitude, precision: Math.round(p.coords.accuracy) });
      },
      function (err) {
        var textos = { 1: 'permiso denegado', 2: 'posición no disponible', 3: 'tardó demasiado' };
        var e = new Error(textos[err.code] || 'error de GPS');
        e.sinPermiso = true;
        reject(e);
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
    );
  });
}

function distanciaMetros(lat1, lng1, lat2, lng2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var a = Math.pow(Math.sin(dLat / 2), 2) +
          Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.pow(Math.sin(dLng / 2), 2);
  return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

/* -------------------------- CAPTURA DE DATOS -------------------------- */

function cambiarStock(skuId, delta) {
  var actual = Number(S.visita.inventario[skuId]) || 0;
  S.visita.inventario[skuId] = Math.max(0, actual + delta);
  // Queda constancia de que lo revisó, aunque el conteo sea cero.
  if (!S.visita.inventarioTocado) S.visita.inventarioTocado = {};
  S.visita.inventarioTocado[skuId] = true;
  guardarVisitaEnCurso();
  var campo = document.querySelector('[data-stock="' + skuId + '"]');
  if (campo) {
    campo.value = S.visita.inventario[skuId];
    var avisoInv = document.getElementById('avisoInventario');
    if (avisoInv) avisoInv.outerHTML = avisoInventario();
  } else {
    render();
  }
}

function responder(preguntaId, opcion) {
  S.visita.respuestas[preguntaId] = opcion;
  guardarVisitaEnCurso();
  render();
}

function alternarEtiqueta(t) {
  var i = S.visita.etiquetas.indexOf(t);
  if (i >= 0) S.visita.etiquetas.splice(i, 1); else S.visita.etiquetas.push(t);
  guardarVisitaEnCurso();
  render();
}

/* ------------------------------ FOTOS ------------------------------ */

var _fotoPendiente = null;
var _fotoEtiqueta = '';

/** Abre la cámara para una foto libre; el id X1, X2… no choca con el catálogo. */
function agregarFotoExtra() {
  var n = fotosExtra().reduce(function (m, id) { return Math.max(m, Number(id.slice(1)) || 0); }, 0) + 1;
  var etiqueta = (S.seccion === 'pla' ? 'planograma ' : 'extra ') + n;
  pedirFoto('X' + n, etiqueta);
}

function pedirFoto(fotoId, etiqueta) {
  _fotoPendiente = fotoId;
  _fotoEtiqueta = etiqueta || '';
  // Al abrir la cámara, Android puede cerrar la app para hacerle espacio.
  // Se guarda todo antes, y se anota qué cuadrito se estaba llenando.
  try { guardarVisitaEnCurso(true); sessionStorage.setItem('ebd_foto_pendiente', fotoId + '|' + _fotoEtiqueta); } catch (e) {}
  var input = document.getElementById('camara');
  input.value = '';
  input.click();
}

document.getElementById('camara').addEventListener('change', function (ev) {
  var archivo = ev.target.files && ev.target.files[0];
  if (!archivo || !_fotoPendiente) return;
  var fotoId = _fotoPendiente;
  _fotoPendiente = null;

  cargando(true);
  reducirImagen(archivo, Math.min(S.config.fotosMaxPx || 1280, 1280), S.config.fotosCalidad)
    .then(function (r) {
      var previa = S.visita.fotos[fotoId] || {};
      S.visita.fotos[fotoId] = { dataUrl: r.dataUrl, thumb: r.thumb, tomadaEn: selloLocal(), tag: _fotoEtiqueta || previa.tag || '' };
      guardarVisitaEnCurso(true);
      try { sessionStorage.removeItem('ebd_foto_pendiente'); } catch (e) {}
      cargando(false);
      render();
    })
    .catch(function (e) {
      cargando(false);
      reportarError('foto', e);
      aviso('No se pudo procesar la foto: ' + e.message + '. Intenta con una foto de la galería.', true);
    });
});

/**
 * Reduce la foto antes de guardarla y arma una miniatura para la pantalla.
 * Una foto de cámara (12 MP) decodificada ocupa ~50 MB; en teléfonos justos
 * eso tumba la pestaña ("memoria insuficiente"). Por eso, cuando el navegador
 * lo permite, se decodifica ya reducida con createImageBitmap y se liberan
 * los recursos apenas se usan.
 */
function reducirImagen(archivo, maxPx, calidad) {
  maxPx = maxPx || 1280;
  calidad = calidad || 0.6;

  function desdeFuente(fuente, ancho, alto) {
    var escala = Math.min(1, maxPx / Math.max(ancho, alto));
    var lienzo = document.createElement('canvas');
    lienzo.width = Math.max(1, Math.round(ancho * escala));
    lienzo.height = Math.max(1, Math.round(alto * escala));
    lienzo.getContext('2d').drawImage(fuente, 0, 0, lienzo.width, lienzo.height);
    var dataUrl = lienzo.toDataURL('image/jpeg', calidad);

    // Miniatura de 240 px para no meter la foto completa en el HTML.
    var esc2 = Math.min(1, 240 / Math.max(lienzo.width, lienzo.height));
    var mini = document.createElement('canvas');
    mini.width = Math.max(1, Math.round(lienzo.width * esc2));
    mini.height = Math.max(1, Math.round(lienzo.height * esc2));
    mini.getContext('2d').drawImage(lienzo, 0, 0, mini.width, mini.height);
    var thumb = mini.toDataURL('image/jpeg', 0.5);

    lienzo.width = lienzo.height = 0;   // suelta la memoria del canvas
    mini.width = mini.height = 0;
    if (fuente.close) { try { fuente.close(); } catch (e) {} }
    return { dataUrl: dataUrl, thumb: thumb };
  }

  // Camino ligero: decodificar ya reducida.
  if (window.createImageBitmap) {
    return createImageBitmap(archivo)
      .then(function (bmp) {
        var escala = Math.min(1, maxPx / Math.max(bmp.width, bmp.height));
        if (escala < 1) {
          var w = Math.round(bmp.width * escala), h = Math.round(bmp.height * escala);
          var ancho = bmp.width, alto = bmp.height;
          bmp.close();
          return createImageBitmap(archivo, { resizeWidth: w, resizeHeight: h, resizeQuality: 'medium' })
            .then(function (b2) { return desdeFuente(b2, b2.width, b2.height); })
            .catch(function () { return caminoClasico(); });
        }
        return desdeFuente(bmp, bmp.width, bmp.height);
      })
      .catch(function () { return caminoClasico(); });
  }
  return caminoClasico();

  function caminoClasico() {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(archivo);
      var img = new Image();
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('archivo de imagen inválido')); };
      img.onload = function () {
        try { resolve(desdeFuente(img, img.width, img.height)); }
        catch (e) { reject(e); }
        finally { URL.revokeObjectURL(url); img.src = ''; }
      };
      img.src = url;
    });
  }
}

/* ---------------------------- CHECK-OUT ---------------------------- */

/**
 * Revisa lo que el administrador dejó marcado como obligatorio y devuelve
 * la primera falta, con la sección donde hay que ir a resolverla.
 */
/** true cuando todos los SKU están en cero: la tienda no tiene nuestro producto. */
function sinInventario() {
  // Se mira el catálogo, no las claves guardadas: así funciona igual con una
  // visita recuperada de una versión anterior o con SKU agregados después.
  var inv = (S.visita && S.visita.inventario) || {};
  var skus = (S.catalogos && S.catalogos.skus) || [];
  return skus.length > 0 && skus.every(function (p) { return !(Number(inv[p.id]) > 0); });
}

/**
 * Lo que la app anota sola al cerrar cuando falta información que no se
 * pudo capturar: sin inventario, sin precios, sin fotos. Va al final de la
 * nota para que el supervisor lo vea sin abrir cada sección.
 */
function notasAutomaticas() {
  var lineas = [];
  if (sinInventario()) lineas.push('Sin inventario de ningún producto en tienda.');

  var nm = S.visita.preciosNoMostrados || {};
  var noMostrados = S.catalogos.competencia.filter(function (k) { return nm[k.id]; });
  var sinPrecio = S.catalogos.competencia.filter(function (k) {
    return !nm[k.id] && String(S.visita.precios[k.id] || '').trim() === '';
  });
  if (noMostrados.length) {
    lineas.push('Precio no mostrado: ' + noMostrados.map(function (k) { return k.marca; }).join(', ') + '.');
  }
  if (sinPrecio.length && sinPrecio.length === S.catalogos.competencia.length) {
    lineas.push('Sin precios de los productos.');
  } else if (sinPrecio.length) {
    lineas.push('Sin precio de: ' + sinPrecio.map(function (k) { return k.marca; }).join(', ') + '.');
  }

  // Fotos marcadas "no hay" (sin material, sin exhibición…) y las que
  // simplemente quedaron sin tomar. Con cuadritos por categoría es normal que
  // sobren algunos, así que las vacías solo se listan si no hay ninguna foto.
  var nh = S.visita.fotosNoHay || {};
  var noHay = S.catalogos.fotos.filter(function (f) { return nh[f.id] && !S.visita.fotos[f.id]; });
  if (noHay.length) {
    lineas.push('Sin foto (no hay qué fotografiar): ' + noHay.map(function (f) {
      return (f.categoria ? f.categoria + ' · ' : '') + f.tag;
    }).join(', ') + '.');
  }
  if (!Object.keys(S.visita.fotos || {}).length) lineas.push('Sin fotos.');
  var obs = String(S.visita.obsFotos || '').trim();
  if (obs) lineas.push('Fotos: ' + obs.replace(/[.]+$/, '') + '.');

  var sinResponder = S.catalogos.preguntas.filter(function (q) { return !S.visita.respuestas[q.id]; });
  if (sinResponder.length) {
    lineas.push('Planograma sin responder: ' + sinResponder.map(function (q) { return q.texto; }).join(' / ') + '.');
  }
  if (calcularSos().pct === null && !sinInventario()) lineas.push('Sin medición de anaquel.');
  return lineas;
}

function primeraFaltaObligatoria() {
  // Ya nada bloquea el cierre: lo obligatorio del catálogo es informativo
  // (pesa en reportes) y lo que falte se anota solo. Ver notasAutomaticas().
  return null;
}

function contarQuiebres(inventario) {
  return Object.keys(inventario || {}).filter(function (k) { return (inventario[k] || 0) === 0; }).length;
}

function segundosDeTexto(mmssTexto) {
  var p = String(mmssTexto || '0:0').split(':');
  return Number(p[0]) * 60 + Number(p[1] || 0);
}

function hacerCheckout() {
  // Nada bloquea el cierre. Lo que falte se anota solo en la nota y se
  // muestra una sola vez para confirmar, por si fue un olvido.
  var automaticas = notasAutomaticas();
  if (automaticas.length && !confirm('Se cerrará la visita con estas observaciones:\n\n· ' +
      automaticas.join('\n· ') + '\n\n¿Cerrar igual? (Cancela para volver y completar.)')) {
    return;
  }

  var sos = calcularSos();
  var nota = String(S.visita.nota || '').trim();
  if (automaticas.length) nota = (nota ? nota + '\n\n' : '') + '[Automático] ' + automaticas.join(' ');
  S.visita.nota = nota;

  var duracion = segundosVisita();
  var payload = {
    visitaId: S.visita.visitaId,
    clienteId: S.visita.clienteId,
    clienteNombre: S.visita.clienteNombre,
    fecha: S.visita.fecha,
    checkin: S.visita.checkin,
    checkout: { hora: horaHM(), lat: '', lng: '' },
    duracionSeg: duracion,
    inventario: S.visita.inventario,
    precios: S.visita.precios,
    monedas: S.visita.monedas || {},
    preciosNoMostrados: S.visita.preciosNoMostrados || {},
    fotosNoHay: S.visita.fotosNoHay || {},
    espacio: S.visita.espacio,
    unidadEspacio: unidadVisita(),
    categoria: S.visita.categoria,
    respuestas: S.visita.respuestas,
    etiquetas: S.visita.etiquetas,
    nota: S.visita.nota,
    fotos: Object.keys(S.visita.fotos).map(function (id) {
      return { id: id, dataUrl: S.visita.fotos[id].dataUrl, tomadaEn: S.visita.fotos[id].tomadaEn,
               tag: S.visita.fotos[id].tag || '' };
    }),
    visitaSubida: false,     // la cabecera ya está en Sheets
    fotosSubidas: [],        // ids de fotos que ya llegaron a Drive
    creadoEn: S.visita.creadoEn
  };

  // Guardar primero en el teléfono: si no hay señal, no se pierde nada.
  S.cola.push(payload);
  var colaLista = guardarCola();
  borrarLocal(LS.VISITA);

  S.cierre = {
    visitaId: payload.visitaId,
    duracionSeg: duracion,
    fotos: payload.fotos.length,
    quiebres: contarQuiebres(S.visita.inventario),
    sos: sos.pct,
    subida: false,
    efectiva: true
  };
  S.fase = 'fin';
  pararCronometro();
  soltarPantalla();
  render();

  // Primero que la cola quede en disco; si la pestaña se cae a mitad de la
  // subida, la visita reaparece como "por subir" y no se pierde.
  Promise.resolve(colaLista).then(function () { subirCola(true); });
}

/* ========================== SINCRONIZACIÓN ========================== */

/**
 * Sube las visitas guardadas, una por una.
 * silencioso = true cuando se dispara sola tras un check-out.
 */
function subirCola(silencioso) {
  if (S.subiendo || !S.cola.length || !S.token) return Promise.resolve();
  S.subiendo = true;
  render();

  var subidas = 0;

  /* Cada visita sube en pasos chicos: primero la cabecera sin fotos, después
     cada foto por separado. Si algo se corta a mitad, la próxima vez sigue
     desde donde quedó (el servidor no duplica). */
  function siguiente() {
    if (!S.cola.length) return Promise.resolve();
    var payload = S.cola[0];
    var fotos = payload.fotos || [];
    var pendientes = fotos.filter(function (f) { return (payload.fotosSubidas || []).indexOf(f.id) < 0; });

    var paso;
    if (!payload.visitaSubida) {
      var sinFotos = {};
      for (var k in payload) if (k !== 'fotos') sinFotos[k] = payload[k];
      sinFotos.fotos = [];
      sinFotos.fotosPendientes = fotos.length;
      paso = api('apiGuardarVisita', S.token, sinFotos).then(function () {
        payload.visitaSubida = true;
        if (!payload.fotosSubidas) payload.fotosSubidas = [];
        guardarCola();
      });
    } else if (pendientes.length) {
      var f = pendientes[0];
      paso = api('apiSubirFotoVisita', S.token,
        { visitaId: payload.visitaId, foto: { id: f.id, dataUrl: f.dataUrl, tomadaEn: f.tomadaEn, tag: f.tag || '' } })
        .then(function () {
          payload.fotosSubidas.push(f.id);
          guardarCola();
        });
    } else {
      S.cola.shift();
      guardarCola();
      subidas++;
      if (S.cierre && payload.visitaId === S.cierre.visitaId) S.cierre.subida = true;
      render();
      return siguiente();
    }
    return paso.then(siguiente);
  }

  return siguiente()
    .then(function () {
      S.subiendo = false;
      if (subidas) aviso(subidas + ' visita' + (subidas === 1 ? '' : 's') + ' en Google Sheets ✓');
      else if (!silencioso) aviso('No había nada por subir.');
      return cargarVista();
    })
    .then(render)
    .catch(function (e) {
      S.subiendo = false;
      render();
      if (!silencioso) aviso('No se pudo subir: ' + e.message + '. Queda guardado en el teléfono.', true);
    });
}

/* ============================ EXPORTAR ============================ */

function exportar() {
  S.exportando = true;
  render();
  api('apiExportar', S.token, null)
    .then(function (r) {
      S.exportando = false;
      render();
      aviso('Listo: hoja "' + r.hoja + '" creada en el libro.');
    })
    .catch(function (e) {
      S.exportando = false;
      render();
      aviso(e.message, true);
    });
}

/* ====================== PLAN DEL DÍA SIGUIENTE ====================== */

function guardarPlan() {
  var m = S.diaDatos && S.diaDatos.manana;
  if (!m || !m.clientes.length) return;

  if (!confirm('Se va a guardar tu ruta de mañana con ' + m.clientes.length +
      ' clientes. Tu supervisor puede ajustarla después. ¿Continuar?')) return;

  S.guardandoPlan = true;
  render();

  api('apiGuardarPlan', S.token, m.fecha,
      m.clientes.map(function (c) { return { clienteId: c.clienteId, hora: c.hora }; }))
    .then(function (r) {
      S.guardandoPlan = false;
      aviso('Plan de mañana guardado: ' + r.clientes + ' clientes.');
      return cargarVista();
    })
    .then(render)
    .catch(function (e) {
      S.guardandoPlan = false;
      render();
      aviso(e.message, true);
    });
}

/* ============================= ANÁLISIS ============================= */

function cambiarPeriodo(dias) {
  if (!dias || dias === S.diasAnalisis) return;
  S.diasAnalisis = dias;
  S.analisisDatos = null;
  render();
  cargando(true);
  cargarVista().then(function () { cargando(false); render(); });
}

function exportarAnalisis() {
  S.exportando = true;
  render();
  api('apiExportarAnalisis', S.token, S.diasAnalisis)
    .then(function (r) {
      S.exportando = false;
      render();
      aviso(r.hallazgos + ' hallazgo(s) en la hoja "' + r.hoja + '".');
    })
    .catch(function (e) {
      S.exportando = false;
      render();
      aviso(e.message, true);
    });
}

/* ================== AVISO ANTES DE CERRAR LA PÁGINA ================== */

window.addEventListener('beforeunload', function (ev) {
  if (S.cola.length || (S.visita && S.fase === 'form')) {
    ev.preventDefault();
    ev.returnValue = '';
  }
});

  <!-- ============================================================

<script>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   JS_CarteraAcciones — qué hace cada botón de la pantalla de cartera.
   =================================================================== */

/* =========================== ESCUCHA PROPIA =========================== */

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a');

  // El velo se cierra al pulsar fuera del recuadro, no dentro.
  if (a === 'cerrar-velo' && el === ev.target) { cerrarModal(); return; }
  if (a === 'dentro') return;

  switch (a) {
    case 'marcar':            alternarSeleccion(el.getAttribute('data-c')); break;
    case 'marcar-todos':      marcarTodos(el.checked); break;
    case 'ver-inactivos':     S.filtros.verInactivos = el.checked; S.seleccion = []; render(); break;
    case 'limpiar-seleccion': S.seleccion = []; render(); break;
    case 'aplicar-cambios':   aplicarCambiosMasivos(); break;
    case 'desactivar-sel':    desactivarSeleccion(); break;

    case 'nuevo-cliente':     S.diasEdicion = {}; abrirModal({ tipo: 'cliente', cliente: { frecuencia: 1, activo: true } }); break;
    case 'editar-cliente':    editarCliente(el.getAttribute('data-c')); break;
    case 'guardar-cliente':   guardarCliente(); break;

    case 'abrir-importar':    abrirModal({ tipo: 'importar' }); break;
    case 'elegir-csv':        document.getElementById('archivo-csv').click(); break;
    case 'previsualizar':     previsualizarImportacion(); break;
    case 'volver-pegar':      S.modal.previo = null; render(); break;
    case 'confirmar-importar': confirmarImportacion(); break;

    case 'abrir-agenda':      abrirAgenda(); break;
    case 'previsualizar-agenda': previsualizarAgenda(); break;
    case 'confirmar-agenda':  confirmarAgenda(); break;

    case 'cerrar-modal':      cerrarModal(); break;

    case 'turno':             alternarTurno(el.getAttribute('data-d'), el.getAttribute('data-turno')); break;
    case 'abrir-dias-masivo': S.diasEdicion = {}; abrirModal({ tipo: 'dias' }); break;
    case 'aplicar-dias':      aplicarDiasMasivo(); break;

    case 'nuevo-item':        nuevoItem(el.getAttribute('data-t')); break;
    case 'editar-item':       editarItem(el.getAttribute('data-t'), el.getAttribute('data-i')); break;
    case 'guardar-item':      guardarItem(); break;
    case 'obligatorio':       alternarItem(el.getAttribute('data-t'), el.getAttribute('data-i'), 'obligatorio'); break;
    case 'activo-item':       alternarItem(el.getAttribute('data-t'), el.getAttribute('data-i'), 'activo'); break;
    case 'guardar-ajustes':   guardarAjustesVisita(); break;
    case 'abrir-exportar':    abrirExportar(); break;

    case 'cartera-tab':       cambiarTabCartera(el.getAttribute('data-t')); break;
    case 'nuevo-usuario':     nuevoUsuario(); break;
    case 'editar-usuario':    editarUsuario(el.getAttribute('data-u')); break;
    case 'guardar-usuario':   guardarUsuario(); break;
    case 'pin-azar':          document.getElementById('f-u-pin').value =
                                String(Math.floor(1000 + Math.random() * 9000)); break;
    case 'regenerar-pin':     regenerarPin(el.getAttribute('data-u')); break;
    case 'alternar-pines':    S.verPines = !S.verPines; render(); break;
    case 'marcar-usuario':    alternarSeleccionUsuario(el.getAttribute('data-u')); break;
    case 'marcar-todos-usuarios': marcarTodosUsuarios(el.checked); break;
    case 'ver-inactivos-usuarios': S.filtros.verInactivosUsuarios = el.checked;
                                   S.seleccionUsuarios = []; render(); break;
    case 'limpiar-seleccion-usuarios': S.seleccionUsuarios = []; render(); break;
    case 'activar-usuarios':  cambiarEstadoUsuarios(true); break;
    case 'desactivar-usuarios': cambiarEstadoUsuarios(false); break;

    case 'refrescar-monitor': refrescarMonitor(false); break;
    case 'alternar-refresco': alternarRefresco(); break;
    case 'alternar-merc':     alternarMercaderista(el.getAttribute('data-u')); break;
    case 'ver-merc':          verMercaderista(el.getAttribute('data-u')); break;
  }
});

document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-a="filtro"]');
  if (el) {
    S.filtros[el.getAttribute('data-f')] = el.value;
    S.seleccion = [];
    render();
    return;
  }

  // Los filtros de "Mis clientes", la pantalla del mercaderista.
  var mio = ev.target.closest('[data-a="filtro-cartera"]');
  if (mio) {
    S.filtrosMiCartera[mio.getAttribute('data-f')] = mio.value;
    render();
  }
});

/* El buscador filtra sin volver a dibujar toda la pantalla en cada tecla. */
var _tiempoBusqueda = null;
document.addEventListener('input', function (ev) {
  var esCliente = ev.target.id === 'buscador';
  var esUsuario = ev.target.id === 'buscadorUsuario';
  var esMiCartera = ev.target.id === 'buscadorCartera';
  if (!esCliente && !esUsuario && !esMiCartera) return;

  if (esCliente) S.filtros.texto = ev.target.value;
  else if (esUsuario) S.filtros.textoUsuario = ev.target.value;
  else S.filtrosMiCartera.texto = ev.target.value;

  clearTimeout(_tiempoBusqueda);
  _tiempoBusqueda = setTimeout(function () {
    var id = ev.target.id;
    var pos = ev.target.selectionStart;
    render();
    var campo = document.getElementById(id);
    if (campo) { campo.focus(); campo.setSelectionRange(pos, pos); }
  }, 220);
});

/* ============================== MODALES ============================== */

function abrirModal(m) { S.modal = m; render(); }
function cerrarModal() { S.modal = null; S.guardando = false; render(); }

/* ============================ SELECCIÓN ============================ */

function alternarSeleccion(id) {
  var i = S.seleccion.indexOf(id);
  if (i >= 0) S.seleccion.splice(i, 1); else S.seleccion.push(id);
  render();
}

function marcarTodos(marcar) {
  S.seleccion = marcar ? clientesFiltrados().map(function (c) { return c.clienteId; }) : [];
  render();
}

function aplicarCambiosMasivos() {
  var cambios = {};

  var ruta = document.getElementById('mover-ruta').value;
  if (ruta === '__nueva__') {
    var nueva = prompt('Número o código de la ruta nueva:');
    if (nueva === null || !nueva.trim()) return;
    cambios.ruta = nueva.trim();
  } else if (ruta) {
    cambios.ruta = ruta;
  }

  var promotor = document.getElementById('mover-promotor').value;
  if (promotor) cambios.promotorId = promotor;

  var frecuencia = document.getElementById('mover-frecuencia').value;
  if (frecuencia) cambios.frecuencia = Number(frecuencia);

  if (!Object.keys(cambios).length) { aviso('Elige qué quieres cambiar.', true); return; }

  var resumen = [];
  if (cambios.ruta !== undefined) resumen.push('ruta ' + cambios.ruta);
  if (cambios.promotorId) {
    var p = S.maestroDatos.promotores.filter(function (x) { return x.id === cambios.promotorId; })[0];
    resumen.push('promotor ' + (p ? p.nombre : cambios.promotorId));
  }
  if (cambios.frecuencia) resumen.push('frecuencia ' + cambios.frecuencia + '×');

  if (!confirm('Se van a cambiar ' + S.seleccion.length + ' cliente(s): ' + resumen.join(', ') + '.\n\n' +
      'Esto no toca las agendas ya generadas, solo las próximas. ¿Continuar?')) return;

  guardarCambiosMasivos(cambios);
}

function desactivarSeleccion() {
  if (!confirm('Se van a desactivar ' + S.seleccion.length + ' cliente(s). ' +
      'Dejan de aparecer en agendas nuevas pero conservan su historial. ¿Continuar?')) return;
  guardarCambiosMasivos({ activo: false });
}

function guardarCambiosMasivos(cambios) {
  cargando(true);
  api('apiMoverClientes', S.token, S.seleccion, cambios)
    .then(function (r) {
      S.seleccion = [];
      aviso(r.tocados + ' cliente(s) actualizados.');
      return recargarMaestro();
    })
    .then(function () { cargando(false); render(); })
    .catch(function (e) { cargando(false); aviso(e.message, true); });
}

/* ========================== DÍAS DE VISITA ========================== */

/** Enciende o apaga el turno de un día en el selector. */
function alternarTurno(dia, turno) {
  var actual = S.diasEdicion[dia] || [];
  var i = actual.indexOf(turno);

  if (i >= 0) actual.splice(i, 1);
  else actual.push(turno);

  // Marcar la mañana descarta el "día sin turno" heredado del archivo.
  var vacio = actual.indexOf('');
  if (vacio >= 0 && actual.length > 1) actual.splice(vacio, 1);

  if (actual.length) S.diasEdicion[dia] = actual;
  else delete S.diasEdicion[dia];

  render();
}

function aplicarDiasMasivo() {
  var dias = objetoADias(S.diasEdicion);
  var cuantos = Object.keys(S.diasEdicion).length;

  if (!confirm(cuantos
      ? 'Se asignarán los días marcados a ' + S.seleccion.length + ' cliente(s), y su ' +
        'frecuencia pasará a ser ' + objetoADias(S.diasEdicion).split(',').length + '. ¿Continuar?'
      : 'No marcaste ningún día: a esos clientes se les quitará el día asignado y la app ' +
        'volverá a repartirlos sola según su ruta. ¿Continuar?')) return;

  S.guardando = true;
  render();

  api('apiMoverClientes', S.token, S.seleccion, { dias: dias })
    .then(function (r) {
      S.guardando = false;
      S.modal = null;
      S.seleccion = [];
      aviso(r.tocados + ' cliente(s) actualizados.');
      return recargarMaestro();
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

/* ========================= ALTA Y EDICIÓN ========================= */

function editarCliente(id) {
  var c = S.maestroDatos.clientes.filter(function (x) { return x.clienteId === id; })[0];
  if (!c) return;
  S.diasEdicion = diasAObjeto(c.dias);
  abrirModal({ tipo: 'cliente', cliente: JSON.parse(JSON.stringify(c)) });
}

function guardarCliente() {
  var val = function (id) {
    var el = document.getElementById('f-' + id);
    return el ? el.value.trim() : '';
  };

  var cliente = {
    clienteId: (S.modal.cliente || {}).clienteId || '',
    nombre: val('nombre'),
    region: val('region'),
    localidad: val('localidad'),
    ubicacion: val('ubicacion'),
    ruta: val('ruta'),
    frecuencia: Number(val('frecuencia')) || 1,
    promotorId: val('promotor'),
    direccion: val('direccion'),
    tipo: val('tipo'),
    geocerca: val('geocerca'),
    dias: objetoADias(S.diasEdicion),
    lat: val('lat'),
    lng: val('lng')
  };

  var activo = document.getElementById('f-activo');
  cliente.activo = activo ? activo.checked : true;

  if (!cliente.nombre) { aviso('El cliente necesita un nombre.', true); return; }

  S.guardando = true;
  render();

  api('apiGuardarCliente', S.token, cliente)
    .then(function (r) {
      S.guardando = false;
      S.modal = null;
      aviso(r.creado ? 'Cliente creado: ' + r.clienteId : 'Cliente actualizado.');
      return recargarMaestro();
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

/* ============================ IMPORTAR ============================ */

function previsualizarImportacion() {
  var texto = document.getElementById('f-pegado').value;
  if (!texto.trim()) { aviso('Pega la tabla o abre un archivo CSV.', true); return; }

  S.modal.texto = texto;
  S.guardando = true;
  render();

  api('apiPrevisualizarImportacion', S.token, texto)
    .then(function (p) {
      S.guardando = false;
      S.modal.previo = p;
      render();
    })
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

function confirmarImportacion() {
  var crear = document.getElementById('f-crear-promotores');
  var desactivar = document.getElementById('f-desactivar');
  var opciones = {
    crearPromotores: crear ? crear.checked : false,
    desactivarAusentes: desactivar ? desactivar.checked : false
  };

  if (opciones.desactivarAusentes &&
      !confirm('Vas a desactivar todos los clientes que no estén en este archivo. ' +
               'Es correcto solo si este archivo es la cartera completa. ¿Continuar?')) return;

  S.guardando = true;
  render();

  api('apiImportar', S.token, S.modal.previo.filas, opciones)
    .then(function (r) {
      S.guardando = false;
      var partes = [r.nuevos + ' clientes nuevos', r.actualizados + ' actualizados'];
      if (r.desactivados) partes.push(r.desactivados + ' desactivados');
      if (r.omitidas) partes.push(r.omitidas + ' filas repetidas omitidas');

      S.modal = {
        tipo: 'resultado',
        titulo: 'Cartera importada',
        texto: partes.join(' · ') + '.' +
          (r.promotoresCreados.length ? '' : ' Ya puedes generar la agenda.'),
        pines: r.promotoresCreados
      };
      return recargarMaestro();
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

/* Lectura del archivo CSV elegido con el botón. */
document.getElementById('archivo-csv').addEventListener('change', function (ev) {
  var archivo = ev.target.files && ev.target.files[0];
  if (!archivo) return;

  var lector = new FileReader();
  lector.onload = function () {
    if (S.modal && S.modal.tipo === 'importar') {
      S.modal.texto = String(lector.result);
      S.modal.archivo = archivo.name;
      S.modal.previo = null;
      render();
      aviso('Archivo leído. Revisa el contenido y pulsa Revisar.');
    }
  };
  lector.onerror = function () { aviso('No se pudo leer el archivo.', true); };
  lector.readAsText(archivo, 'UTF-8');
  ev.target.value = '';
});

/* ============================= AGENDA ============================= */

function abrirAgenda() {
  var hoy = new Date();
  var lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() + (hoy.getDay() === 0 ? 1 : 8 - hoy.getDay()));   // próximo lunes
  var sabado = new Date(lunes);
  sabado.setDate(lunes.getDate() + 5);

  abrirModal({
    tipo: 'agenda',
    desde: fechaISOLocal(lunes),
    hasta: fechaISOLocal(sabado),
    promotorId: '',
    previo: null
  });
}

function datosAgenda() {
  return {
    desde: document.getElementById('f-desde').value,
    hasta: document.getElementById('f-hasta').value,
    promotorId: document.getElementById('f-agenda-promotor').value
  };
}

function previsualizarAgenda() {
  var d = datosAgenda();
  if (!d.desde || !d.hasta) { aviso('Indica el rango de fechas.', true); return; }

  Object.assign(S.modal, d);
  cargando(true);

  api('apiPrevisualizarAgenda', S.token, d.desde, d.hasta, { promotorId: d.promotorId })
    .then(function (p) {
      cargando(false);
      S.modal.previo = p;
      render();
    })
    .catch(function (e) { cargando(false); aviso(e.message, true); });
}

function confirmarAgenda() {
  var d = datosAgenda();
  var reemplazar = document.getElementById('f-reemplazar').checked;
  if (!d.desde || !d.hasta) { aviso('Indica el rango de fechas.', true); return; }

  if (reemplazar && !confirm('Se borrará la agenda existente entre ' + d.desde + ' y ' + d.hasta +
      (d.promotorId ? ' para ese promotor' : ' para todos los promotores') +
      ' y se rehará desde la cartera.\n\nLas visitas ya registradas NO se tocan. ¿Continuar?')) return;

  Object.assign(S.modal, d);
  S.guardando = true;
  render();

  api('apiGenerarAgenda', S.token, d.desde, d.hasta,
      { promotorId: d.promotorId, reemplazar: reemplazar })
    .then(function (r) {
      S.guardando = false;
      S.modal = {
        tipo: 'resultado',
        titulo: 'Agenda generada',
        texto: r.asignaciones + ' visitas programadas entre ' + r.desde + ' y ' + r.hasta +
               ' para ' + r.promotores + ' promotor(es). Ya aparecen en la ruta del día de cada uno.',
        pines: []
      };
      render();
    })
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

/* ====================== PROMOTORES Y ACCESOS ====================== */

function cambiarTabCartera(tab) {
  S.carteraTab = tab;
  S.seleccion = [];
  S.seleccionUsuarios = [];
  render();

  if (tab === 'usuarios' && !S.usuariosDatos) {
    cargando(true);
    recargarUsuarios().then(function () { cargando(false); render(); });
  }
  if (tab === 'catalogos' && !S.catalogosDatos) {
    cargando(true);
    recargarCatalogos().then(function () { cargando(false); render(); });
  }
}

function recargarUsuarios() {
  return api('apiUsuarios', S.token)
    .then(function (d) { S.usuariosDatos = d; })
    .catch(function (e) { aviso(e.message, true); });
}

function alternarSeleccionUsuario(id) {
  var i = S.seleccionUsuarios.indexOf(id);
  if (i >= 0) S.seleccionUsuarios.splice(i, 1); else S.seleccionUsuarios.push(id);
  render();
}

function marcarTodosUsuarios(marcar) {
  if (!marcar) { S.seleccionUsuarios = []; render(); return; }
  var texto = normalizarBusqueda(S.filtros.textoUsuario);
  S.seleccionUsuarios = S.usuariosDatos.usuarios.filter(function (u) {
    if (!S.filtros.verInactivosUsuarios && !u.activo) return false;
    if (!texto) return true;
    return normalizarBusqueda([u.nombre, u.usuario, u.zona, u.ruta].join(' ')).indexOf(texto) >= 0;
  }).map(function (u) { return u.usuarioId; });
  render();
}

function nuevoUsuario() {
  abrirModal({ tipo: 'usuario', usuario: { rol: 'merc', activo: true } });
  // El servidor propone un acceso libre y un PIN al azar.
  api('apiSugerirUsuario', S.token, '')
    .then(function (r) {
      if (S.modal && S.modal.tipo === 'usuario' && !S.modal.usuario.usuarioId) {
        var campo = document.getElementById('f-u-pin');
        if (campo && !campo.value) campo.value = r.pin;
      }
    })
    .catch(function () { /* si falla, el administrador escribe el PIN a mano */ });
}

function editarUsuario(id) {
  var u = S.usuariosDatos.usuarios.filter(function (x) { return x.usuarioId === id; })[0];
  if (u) abrirModal({ tipo: 'usuario', usuario: JSON.parse(JSON.stringify(u)) });
}

/* Al escribir el nombre en un usuario nuevo, se propone el acceso. */
document.addEventListener('input', function (ev) {
  if (ev.target.id !== 'f-u-nombre') return;
  if (!S.modal || S.modal.tipo !== 'usuario' || S.modal.usuario.usuarioId) return;

  var acceso = document.getElementById('f-u-usuario');
  if (!acceso || acceso.dataset.tocado === 'si') return;

  clearTimeout(_tiempoSugerencia);
  var nombre = ev.target.value;
  _tiempoSugerencia = setTimeout(function () {
    api('apiSugerirUsuario', S.token, nombre)
      .then(function (r) {
        var campo = document.getElementById('f-u-usuario');
        if (campo && campo.dataset.tocado !== 'si') campo.value = r.usuario;
      })
      .catch(function () {});
  }, 400);
});
var _tiempoSugerencia = null;

/* Si el administrador escribe el acceso a mano, se deja de proponer. */
document.addEventListener('input', function (ev) {
  if (ev.target.id === 'f-u-usuario') ev.target.dataset.tocado = 'si';
});

function guardarUsuario() {
  var val = function (id) {
    var el = document.getElementById('f-u-' + id);
    return el ? el.value.trim() : '';
  };

  var datos = {
    usuarioId: (S.modal.usuario || {}).usuarioId || '',
    nombre: val('nombre'),
    usuario: val('usuario').toLowerCase(),
    pin: val('pin'),
    rol: val('rol'),
    zona: val('zona'),
    ruta: val('ruta')
  };

  var activo = document.getElementById('f-u-activo');
  datos.activo = activo ? activo.checked : true;

  if (!datos.nombre) { aviso('Escribe el nombre de la persona.', true); return; }
  if (!datos.usuario) { aviso('Escribe el nombre de acceso.', true); return; }
  if (datos.pin && !/^\d{4}$/.test(datos.pin)) { aviso('El PIN debe ser de 4 dígitos.', true); return; }
  if (!datos.usuarioId && !datos.pin) { aviso('Ponle un PIN o pulsa “Al azar”.', true); return; }

  S.guardando = true;
  render();

  api('apiGuardarUsuario', S.token, datos)
    .then(function (r) {
      S.guardando = false;
      if (r.creado) {
        S.modal = {
          tipo: 'resultado',
          titulo: 'Usuario creado',
          texto: datos.nombre + ' ya puede entrar a la app.',
          pines: [{ nombre: datos.nombre, usuario: r.usuario, pin: r.pin }]
        };
      } else {
        S.modal = null;
        aviso('Usuario actualizado.');
      }
      return Promise.all([recargarUsuarios(), recargarMaestro()]);
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

function regenerarPin(id) {
  var u = S.usuariosDatos.usuarios.filter(function (x) { return x.usuarioId === id; })[0];
  if (!u) return;
  if (!confirm('Se le va a generar un PIN nuevo a ' + u.nombre + '. ' +
      'El anterior deja de servir en cuanto se guarde. ¿Continuar?')) return;

  cargando(true);
  api('apiRegenerarPin', S.token, id)
    .then(function (r) {
      cargando(false);
      S.verPines = true;
      S.modal = {
        tipo: 'resultado',
        titulo: 'PIN nuevo',
        texto: 'Entrégaselo a ' + r.nombre + '. También queda visible en la hoja Usuarios.',
        pines: [{ nombre: r.nombre, usuario: r.usuario, pin: r.pin }]
      };
      return recargarUsuarios();
    })
    .then(render)
    .catch(function (e) { cargando(false); aviso(e.message, true); });
}

function cambiarEstadoUsuarios(activo) {
  var n = S.seleccionUsuarios.length;
  if (!activo && !confirm('Se van a desactivar ' + n + ' usuario(s). ' +
      'Dejan de poder entrar, pero su historial se conserva. ¿Continuar?')) return;

  cargando(true);
  api('apiEstadoUsuarios', S.token, S.seleccionUsuarios, activo)
    .then(function (r) {
      S.seleccionUsuarios = [];
      cargando(false);
      aviso(r.tocados + ' usuario(s) ' + (activo ? 'activados' : 'desactivados') + '.');
      return Promise.all([recargarUsuarios(), recargarMaestro()]);
    })
    .then(render)
    .catch(function (e) { cargando(false); aviso(e.message, true); });
}

/* ============================= CATÁLOGOS ============================= */

function recargarCatalogos() {
  return api('apiCatalogosAdmin', S.token)
    .then(function (d) { S.catalogosDatos = d; })
    .catch(function (e) { aviso(e.message, true); });
}

function nuevoItem(tipo) {
  abrirModal({ tipo: 'item', catalogo: tipo, item: { activo: true, obligatorio: false } });
}

function editarItem(tipo, id) {
  var it = (S.catalogosDatos[tipo] || []).filter(function (x) { return x.id === id; })[0];
  if (it) abrirModal({ tipo: 'item', catalogo: tipo, item: JSON.parse(JSON.stringify(it)) });
}

function guardarItem() {
  var m = S.modal;
  var def = CATALOGOS_APP[m.catalogo];
  var item = { id: (m.item || {}).id || '' };

  def.campos.forEach(function (c) {
    var el = document.getElementById('f-i-' + c.k);
    item[c.k] = el ? el.value.trim() : '';
  });

  var oblig = document.getElementById('f-i-obligatorio');
  item.obligatorio = oblig ? oblig.checked : false;
  var activo = document.getElementById('f-i-activo');
  item.activo = activo ? activo.checked : true;

  S.guardando = true;
  render();

  api('apiGuardarItemCatalogo', S.token, m.catalogo, item)
    .then(function () {
      S.guardando = false;
      S.modal = null;
      aviso('Guardado. Los mercaderistas lo verán al volver a entrar.');
      return recargarCatalogos();
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

/** Enciende o apaga un elemento, o lo vuelve obligatorio. */
function alternarItem(tipo, id, campo) {
  var it = (S.catalogosDatos[tipo] || []).filter(function (x) { return x.id === id; })[0];
  if (!it) return;

  var cambios = {};
  cambios[campo] = !it[campo];

  api('apiEstadoItemCatalogo', S.token, tipo, [id], cambios)
    .then(function () { return recargarCatalogos(); })
    .then(render)
    .catch(function (e) { aviso(e.message, true); });
}

function guardarAjustesVisita() {
  var val = function (id) {
    var el = document.getElementById('f-a-' + id);
    return el ? el.value.trim() : '';
  };

  var ajustes = {
    categoria: val('categoria'),
    metaSos: Number(val('metaSos')) || 30,
    unidadEspacio: val('unidad'),
    metaMinutos: Number(val('minutos')) || 12,
    geocerca: Number(val('geocerca')) || 120,
    moneda: val('moneda'),
    monedas: val('monedas'),
    motivosNoEfectiva: val('motivos'),
    exigirGeocerca: document.getElementById('f-a-geo').checked,
    exigirEspacio: document.getElementById('f-a-espacio').checked
  };

  S.guardando = true;
  render();

  api('apiGuardarAjustesVisita', S.token, ajustes)
    .then(function () {
      S.guardando = false;
      aviso('Reglas guardadas.');
      return recargarCatalogos();
    })
    .then(render)
    .catch(function (e) {
      S.guardando = false;
      render();
      aviso(e.message, true);
    });
}

function abrirExportar() {
  abrirModal({ tipo: 'exportar', enlaces: null });
  api('apiEnlacesExportacion', S.token)
    .then(function (d) {
      if (S.modal && S.modal.tipo === 'exportar') { S.modal.enlaces = d; render(); }
    })
    .catch(function (e) { cerrarModal(); aviso(e.message, true); });
}

/* ========================= MONITOREO EN VIVO ========================= */

function alternarRefresco() {
  S.autoRefresco = !S.autoRefresco;
  if (S.autoRefresco) { arrancarMonitor(); refrescarMonitor(true); } else pararMonitor();
  render();
  aviso(S.autoRefresco ? 'Actualización automática encendida.' : 'Actualización automática en pausa.');
}

/** Oculta o muestra a un mercaderista en el mapa de polígonos. */
function alternarMercaderista(id) {
  if (S.mercOculto[id]) delete S.mercOculto[id]; else S.mercOculto[id] = true;
  render();
}

function verMercaderista(id) {
  abrirModal({ tipo: 'merc', detalle: null });
  api('apiDetalleMercaderista', S.token, id, null)
    .then(function (d) {
      if (S.modal && S.modal.tipo === 'merc') { S.modal.detalle = d; render(); }
    })
    .catch(function (e) { cerrarModal(); aviso(e.message, true); });
}

/* ============================ RECARGA ============================ */

function recargarMaestro() {
  return api('apiMaestro', S.token)
    .then(function (d) { S.maestroDatos = d; })
    .catch(function (e) { aviso(e.message, true); });
}
</script>

  
  <!-- ============================================================
       JS_FotosAcciones
       ============================================================ -->
<script>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   JS_FotosAcciones — qué hace cada botón de la galería por cliente
   y del análisis de trade marketing.
   =================================================================== */

document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-a]');
  if (!el) return;
  var a = el.getAttribute('data-a');

  if (a === 'cerrar-velo' && el === ev.target) { cerrarModal(); return; }
  if (a === 'dentro') return;

  switch (a) {
    case 'abrir-cliente-fotos': abrirClienteFotos(el.getAttribute('data-c')); break;
    case 'ver-visita-cliente':  verVisitaCliente(el.getAttribute('data-v')); break;
    case 'ver-foto-cliente':    verFotoGrandeCliente(el.getAttribute('data-arch')); break;
    case 'volver-desde-foto':   if (S.modal && S.modal.volverA) { S.modal = S.modal.volverA; render(); } break;
    case 'periodo-fotos':       cambiarPeriodoFotos(Number(el.getAttribute('data-d'))); break;
  }
});

document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-a="filtro-fotos"]');
  if (!el) return;
  S.filtrosFotos[el.getAttribute('data-f')] = el.value;
  recargarFotos();
});

var _tiempoBusquedaFotos = null;
document.addEventListener('input', function (ev) {
  if (ev.target.id !== 'buscadorFotos') return;
  S.filtrosFotos.texto = ev.target.value;
  clearTimeout(_tiempoBusquedaFotos);
  _tiempoBusquedaFotos = setTimeout(function () {
    var pos = ev.target.selectionStart;
    render();
    var campo = document.getElementById('buscadorFotos');
    if (campo) { campo.focus(); campo.setSelectionRange(pos, pos); }
  }, 250);
});

/* ============================== DIRECTORIO ============================== */

function recargarFotos() {
  cargando(true);
  var f = S.filtrosFotos;

  return api('apiClientesConFotos', S.token, {
    promotorId: f.promotorId, region: f.region, texto: f.texto
  })
    .then(function (d) { S.fotosDatos = d; })
    .catch(function (e) { aviso(e.message, true); })
    .then(function () {
      cargando(false);
      render();
    });
}

/* ========================= HISTORIAL DE UN CLIENTE ========================= */

function abrirClienteFotos(clienteId) {
  abrirModal({ tipo: 'cliente-fotos', clienteId: clienteId, visitaId: null, datos: null });
  api('apiFotosCliente', S.token, clienteId)
    .then(function (d) {
      if (S.modal && S.modal.tipo === 'cliente-fotos' && S.modal.clienteId === clienteId) {
        S.modal.datos = d;
        render();
      }
    })
    .catch(function (e) { cerrarModal(); aviso(e.message, true); });
}

function verVisitaCliente(visitaId) {
  if (!S.modal || S.modal.tipo !== 'cliente-fotos') return;
  S.modal.visitaId = visitaId;
  render();
}

function verFotoGrandeCliente(archivoId) {
  var previo = S.modal;   // se conserva para poder "volver" con el botón cerrar
  abrirModal({ tipo: 'foto-grande', archivoId: archivoId, dataUrl: null,
               enlace: '', volverA: previo });

  api('apiFotoAdmin', S.token, archivoId)
    .then(function (r) {
      if (S.modal && S.modal.tipo === 'foto-grande' && S.modal.archivoId === archivoId) {
        S.modal.dataUrl = r.dataUrl;
        render();
      }
    })
    .catch(function (e) { cerrarModal(); aviso(e.message, true); });
}

/* ============================= ANÁLISIS ============================= */

function recargarAnalisisFotos() {
  return api('apiAnalisisFotos', S.token, S.diasAnalisisFotos)
    .then(function (d) { S.analisisFotosDatos = d; })
    .catch(function (e) { aviso(e.message, true); });
}

function cambiarPeriodoFotos(dias) {
  if (!dias || dias === S.diasAnalisisFotos) return;
  S.diasAnalisisFotos = dias;
  S.analisisFotosDatos = null;
  render();
  cargando(true);
  recargarAnalisisFotos().then(function () { cargando(false); render(); });
}
</script>


  <script>
  /* La app se guarda en el teléfono: abre aunque no haya señal. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nuevo = reg.installing;
          nuevo && nuevo.addEventListener('statechange', function () {
            if (nuevo.state === 'installed' && navigator.serviceWorker.controller) {
              try { aviso('Hay una versión nueva. Cierra y vuelve a abrir la app para usarla.'); } catch (e) {}
            }
          });
        });
      }).catch(function () {});
    });
  }
  </script>

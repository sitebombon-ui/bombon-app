<script>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   JS_Cartera — pantalla de administración de clientes y rutas:
   alta, edición, movimientos masivos, importación y generación de agenda.
   =================================================================== */

/* ============================== LA TABLA ============================== */

function clientesFiltrados() {
  var d = S.maestroDatos;
  if (!d) return [];
  var f = S.filtros;
  var texto = normalizarBusqueda(f.texto);

  return d.clientes.filter(function (c) {
    if (!f.verInactivos && !c.activo) return false;
    if (f.promotor && c.promotorId !== f.promotor) return false;
    if (f.promotor === '__sin__' && c.promotorId) return false;
    if (f.ruta && String(c.ruta) !== f.ruta) return false;
    if (f.region && c.region !== f.region) return false;
    if (texto) {
      var todo = normalizarBusqueda(
        [c.nombre, c.localidad, c.ubicacion, c.region, c.promotor, c.clienteId].join(' '));
      if (todo.indexOf(texto) < 0) return false;
    }
    return true;
  });
}

function normalizarBusqueda(t) {
  var mapa = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u', 'ñ': 'n' };
  return String(t || '').toLowerCase().replace(/[áéíóúüñ]/g, function (c) { return mapa[c]; }).trim();
}

/** Las dos pestañas de administración: la cartera y la gente. */
function vistaCartera() {
  return S.carteraTab === 'usuarios' ? vistaUsuarios()
       : S.carteraTab === 'catalogos' ? vistaCatalogos()
       : vistaClientes();
}

function pestanasCartera(activa) {
  var tabs = [{ k: 'clientes', t: 'Clientes' }, { k: 'usuarios', t: 'Promotores y accesos' },
              { k: 'catalogos', t: 'Qué hacer en la visita' }];
  return '<div class="secciones" style="padding:0 0 14px">' +
    tabs.map(function (x) {
      return '<button class="pill' + (activa === x.k ? ' activa' : '') + '" ' +
             'data-a="cartera-tab" data-t="' + x.k + '">' + x.t + '</button>';
    }).join('') +
  '</div>';
}

function vistaClientes() {
  var d = S.maestroDatos;
  if (!d) return '<div class="ancho-1180">' + pestanasCartera('clientes') +
                 '<div class="vacio">Cargando la cartera…</div></div>';

  var lista = clientesFiltrados();
  var f = S.filtros;

  var opciones = function (valores, sel, vacio) {
    return '<option value="">' + vacio + '</option>' + valores.map(function (v) {
      var val = typeof v === 'string' ? v : v.id;
      var txt = typeof v === 'string' ? v : v.nombre;
      return '<option value="' + esc(val) + '"' + (sel === val ? ' selected' : '') + '>' + esc(txt) + '</option>';
    }).join('');
  };

  var filas = lista.length ? lista.map(function (c) {
    var marcado = S.seleccion.indexOf(c.clienteId) >= 0;
    return '' +
    '<tr class="' + (marcado ? 'sel ' : '') + (c.activo ? '' : 'inactiva') + '">' +
      '<td class="col-check"><input type="checkbox" data-a="marcar" data-c="' + esc(c.clienteId) + '"' +
        (marcado ? ' checked' : '') + '></td>' +
      '<td>' +
        '<div class="nom">' + esc(c.nombre) + '</div>' +
        '<div class="sub">' + esc(c.clienteId) + (c.activo ? '' : ' · inactivo') + '</div>' +
      '</td>' +
      '<td>' + esc(c.region) + '</td>' +
      '<td>' + esc(c.localidad) + '<div class="sub">' + esc(c.ubicacion) + '</div></td>' +
      '<td><span class="pastilla-ruta' + (c.ruta ? '' : ' vacia') + '">' + esc(c.ruta || '—') + '</span></td>' +
      '<td class="num"><span class="frec">' + c.frecuencia + '×</span></td>' +
      '<td><span class="dias-chip' + (c.diasTexto ? '' : ' vacio') + '">' +
        esc(c.diasTexto || 'sin día') + '</span></td>' +
      '<td>' + (c.promotor
        ? esc(c.promotor)
        : '<span class="etq-accion error">sin asignar</span>') + '</td>' +
      '<td class="num"><button class="btn-fila" data-a="editar-cliente" data-c="' + esc(c.clienteId) + '">Editar</button></td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="9" style="padding:26px;text-align:center;color:#8B94A2">' +
                'Ningún cliente coincide con el filtro.</td></tr>';

  var barraSeleccion = S.seleccion.length ? bloqueSeleccion(d) : '';

  return '' +
  '<div class="ancho-1180">' +
    pestanasCartera('clientes') +
    '<div class="encabezado-panel">' +
      '<div>' +
        '<div class="fecha-hoy">' + d.clientes.length + ' clientes · ' + d.promotores.length + ' promotores</div>' +
        '<h1 class="titulo">Clientes y rutas</h1>' +
        '<div class="subtexto">Esta es la cartera maestra. La agenda diaria se genera desde aquí.' +
          (d.sinPromotor ? ' <strong>' + d.sinPromotor + ' cliente(s) sin promotor asignado.</strong>' : '') +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn-sec" data-a="abrir-importar">Importar cartera</button>' +
        '<button class="btn-oro-sec" data-a="abrir-agenda">Generar agenda</button>' +
        '<button class="btn-pri" data-a="nuevo-cliente">Nuevo cliente</button>' +
      '</div>' +
    '</div>' +

    barraSeleccion +

    '<div class="barra-herramientas">' +
      '<input class="buscador" id="buscador" placeholder="Buscar por nombre, localidad o promotor…" ' +
             'value="' + esc(f.texto) + '">' +
      '<select class="filtro" data-a="filtro" data-f="promotor">' +
        '<option value="">Todos los promotores</option>' +
        '<option value="__sin__"' + (f.promotor === '__sin__' ? ' selected' : '') + '>Sin promotor</option>' +
        d.promotores.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (f.promotor === p.id ? ' selected' : '') + '>' +
                 esc(p.nombre) + ' (' + p.clientes + ')</option>';
        }).join('') +
      '</select>' +
      '<select class="filtro" data-a="filtro" data-f="ruta">' + opciones(d.rutas.map(String), f.ruta, 'Todas las rutas') + '</select>' +
      '<select class="filtro" data-a="filtro" data-f="region">' + opciones(d.regiones, f.region, 'Todas las regiones') + '</select>' +
      '<label class="frec" style="display:flex;align-items:center;gap:6px;white-space:nowrap">' +
        '<input type="checkbox" data-a="ver-inactivos"' + (f.verInactivos ? ' checked' : '') + '> ver inactivos' +
      '</label>' +
    '</div>' +

    '<div class="contenedor-tabla">' +
      '<table class="tabla-cartera">' +
        '<thead><tr>' +
          '<th class="col-check"><input type="checkbox" data-a="marcar-todos"' +
            (lista.length && S.seleccion.length === lista.length ? ' checked' : '') + '></th>' +
          '<th>Cliente</th><th>Región</th><th>Localidad / Ubicación</th>' +
          '<th>Ruta</th><th class="num">Frec.</th><th>Días</th><th>Promotor</th><th></th>' +
        '</tr></thead>' +
        '<tbody>' + filas + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="subtexto" style="margin-top:10px">Mostrando ' + lista.length + ' de ' + d.clientes.length + ' clientes.</div>' +
  '</div>';
}

function bloqueSeleccion(d) {
  return '' +
  '<div class="seleccion-barra">' +
    '<span class="cuenta">' + S.seleccion.length + ' seleccionado(s)</span>' +
    '<select id="mover-ruta"><option value="">Mover a ruta…</option>' +
      d.rutas.map(function (r) { return '<option value="' + esc(r) + '">Ruta ' + esc(r) + '</option>'; }).join('') +
      '<option value="__nueva__">Ruta nueva…</option>' +
    '</select>' +
    '<select id="mover-promotor"><option value="">Cambiar promotor…</option>' +
      d.promotores.map(function (p) { return '<option value="' + esc(p.id) + '">' + esc(p.nombre) + '</option>'; }).join('') +
    '</select>' +
    '<select id="mover-frecuencia"><option value="">Frecuencia…</option>' +
      [1, 2, 3, 4, 5, 6].map(function (n) { return '<option value="' + n + '">' + n + ' vez(es) por semana</option>'; }).join('') +
    '</select>' +
    '<button data-a="abrir-dias-masivo">Asignar días…</button>' +
    '<button data-a="aplicar-cambios">Aplicar</button>' +
    '<button class="btn-texto" data-a="desactivar-sel">Desactivar</button>' +
    '<button class="btn-texto" data-a="limpiar-seleccion">Cancelar</button>' +
  '</div>';
}

/* ==================== SELECTOR DE DÍAS DE VISITA ==================== */

var DIAS_APP = [
  { cod: 'LUN', nombre: 'Lunes' }, { cod: 'MAR', nombre: 'Martes' },
  { cod: 'MIE', nombre: 'Miércoles' }, { cod: 'JUE', nombre: 'Jueves' },
  { cod: 'VIE', nombre: 'Viernes' }, { cod: 'SAB', nombre: 'Sábado' },
  { cod: 'DOM', nombre: 'Domingo' }
];

/** Lee "LUN-M,VIE-T" y devuelve { LUN:['M'], VIE:['T'] } */
function diasAObjeto(texto) {
  var salida = {};
  String(texto || '').split(/[,;|]+/).forEach(function (parte) {
    var t = parte.trim();
    if (!t) return;
    var p = t.split(/[-:. ]+/);
    var cod = (p[0] || '').toUpperCase().slice(0, 3);
    if (!DIAS_APP.some(function (d) { return d.cod === cod; })) return;
    var turno = (p[1] || '').toUpperCase().slice(0, 1);
    if (!salida[cod]) salida[cod] = [];
    if (salida[cod].indexOf(turno) < 0) salida[cod].push(turno);
  });
  return salida;
}

function objetoADias(obj) {
  var salida = [];
  DIAS_APP.forEach(function (d) {
    (obj[d.cod] || []).forEach(function (turno) {
      salida.push(d.cod + (turno ? '-' + turno : ''));
    });
  });
  return salida.join(',');
}

/**
 * El selector: una fila por día con los botones M y T.
 * Es la misma idea de la matriz del Excel, pero en vertical.
 */
function selectorDias(seleccion, prefijo) {
  return '' +
  '<div class="dias-picker" id="' + prefijo + '">' +
    DIAS_APP.map(function (d) {
      var turnos = seleccion[d.cod] || [];
      var tieneM = turnos.indexOf('M') >= 0 || turnos.indexOf('') >= 0;
      var tieneT = turnos.indexOf('T') >= 0;
      return '<div class="dia-fila' + (turnos.length ? ' activa' : '') + '">' +
        '<div class="nom">' + d.nombre +
          (turnos.length ? '<small>' + (tieneM ? 'mañana' : '') +
            (tieneM && tieneT ? ' y ' : '') + (tieneT ? 'tarde' : '') + '</small>' : '') +
        '</div>' +
        '<button type="button" class="turno-btn' + (tieneM ? ' on' : '') + '" ' +
          'data-a="turno" data-p="' + prefijo + '" data-d="' + d.cod + '" data-turno="M">M</button>' +
        '<button type="button" class="turno-btn tarde' + (tieneT ? ' on' : '') + '" ' +
          'data-a="turno" data-p="' + prefijo + '" data-d="' + d.cod + '" data-turno="T">T</button>' +
      '</div>';
    }).join('') +
  '</div>' +
  '<div class="campo-ayuda">M = mañana, T = tarde. Un cliente de frecuencia 2 lleva dos marcas. ' +
    'Si no marcas ningún día, la app lo reparte sola según su ruta.</div>';
}

/* ====================== PROMOTORES Y ACCESOS ====================== */

function vistaUsuarios() {
  var d = S.usuariosDatos;
  if (!d) return '<div class="ancho-1180">' + pestanasCartera('usuarios') +
                 '<div class="vacio">Cargando los usuarios…</div></div>';

  var texto = normalizarBusqueda(S.filtros.textoUsuario);
  var lista = d.usuarios.filter(function (u) {
    if (!S.filtros.verInactivosUsuarios && !u.activo) return false;
    if (!texto) return true;
    return normalizarBusqueda([u.nombre, u.usuario, u.zona, u.ruta].join(' ')).indexOf(texto) >= 0;
  });

  var filas = lista.length ? lista.map(function (u) {
    var marcado = S.seleccionUsuarios.indexOf(u.usuarioId) >= 0;
    return '' +
    '<tr class="' + (marcado ? 'sel ' : '') + (u.activo ? '' : 'inactiva') + '">' +
      '<td class="col-check"><input type="checkbox" data-a="marcar-usuario" data-u="' +
        esc(u.usuarioId) + '"' + (marcado ? ' checked' : '') + '></td>' +
      '<td>' +
        '<div class="persona">' +
          '<div class="avatar-28">' + esc(iniciales(u.nombre)) + '</div>' +
          '<div><div class="nom">' + esc(u.nombre) + '</div>' +
          '<div class="sub">' + esc(u.usuarioId) + (u.activo ? '' : ' · inactivo') + '</div></div>' +
        '</div>' +
      '</td>' +
      '<td><span class="acceso">' + esc(u.usuario) + '</span></td>' +
      '<td>' + celdaPin(u) + '</td>' +
      '<td>' + (u.rol === 'admin'
        ? '<span class="chip chip-oro">Administrador</span>'
        : '<span class="chip chip-azul">Mercaderista</span>') + '</td>' +
      '<td>' + esc(u.zona || '—') + '<div class="sub">ruta ' + esc(u.ruta || '—') + '</div></td>' +
      '<td class="num">' +
        (u.rol === 'merc'
          ? '<div class="avance">' + u.clientes + '</div><div class="sub">' + u.visitasSemana + ' visitas/sem</div>'
          : '<span class="sub">—</span>') +
      '</td>' +
      '<td class="num">' +
        (u.rol === 'merc' && u.planHoy
          ? '<div class="avance">' + u.visitasHoy + '<small>/' + u.planHoy + '</small></div>'
          : '<span class="sub">—</span>') +
      '</td>' +
      '<td class="num" style="white-space:nowrap">' +
        '<button class="btn-fila" data-a="editar-usuario" data-u="' + esc(u.usuarioId) + '">Editar</button>' +
        '<button class="btn-fila" data-a="regenerar-pin" data-u="' + esc(u.usuarioId) + '">PIN nuevo</button>' +
      '</td>' +
    '</tr>';
  }).join('') : '<tr><td colspan="9" style="padding:26px;text-align:center;color:#8B94A2">' +
                'Ningún usuario coincide con la búsqueda.</td></tr>';

  return '' +
  '<div class="ancho-1180">' +
    pestanasCartera('usuarios') +
    '<div class="encabezado-panel">' +
      '<div>' +
        '<div class="fecha-hoy">' + d.mercaderistas + ' mercaderistas · ' +
          d.administradores + ' administrador(es) activos</div>' +
        '<h1 class="titulo">Promotores y accesos</h1>' +
        '<div class="subtexto">Quién puede entrar a la app y con qué PIN. ' +
          'También puedes cambiarlo escribiendo directo en la hoja Usuarios.</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn-sec" data-a="alternar-pines">' +
          (S.verPines ? 'Ocultar PIN' : 'Mostrar PIN') + '</button>' +
        '<button class="btn-pri" data-a="nuevo-usuario">Nuevo usuario</button>' +
      '</div>' +
    '</div>' +

    (S.seleccionUsuarios.length
      ? '<div class="seleccion-barra">' +
          '<span class="cuenta">' + S.seleccionUsuarios.length + ' seleccionado(s)</span>' +
          '<button data-a="activar-usuarios">Activar</button>' +
          '<button class="btn-texto" data-a="desactivar-usuarios">Desactivar</button>' +
          '<button class="btn-texto" data-a="limpiar-seleccion-usuarios">Cancelar</button>' +
        '</div>'
      : '') +

    '<div class="barra-herramientas">' +
      '<input class="buscador" id="buscadorUsuario" placeholder="Buscar por nombre o acceso…" ' +
             'value="' + esc(S.filtros.textoUsuario) + '">' +
      '<label class="frec" style="display:flex;align-items:center;gap:6px;white-space:nowrap">' +
        '<input type="checkbox" data-a="ver-inactivos-usuarios"' +
          (S.filtros.verInactivosUsuarios ? ' checked' : '') + '> ver inactivos' +
      '</label>' +
    '</div>' +

    '<div class="contenedor-tabla">' +
      '<table class="tabla-cartera">' +
        '<thead><tr>' +
          '<th class="col-check"><input type="checkbox" data-a="marcar-todos-usuarios"' +
            (lista.length && S.seleccionUsuarios.length === lista.length ? ' checked' : '') + '></th>' +
          '<th>Nombre</th><th>Acceso</th><th>PIN</th><th>Rol</th><th>Zona / ruta</th>' +
          '<th class="num">Clientes</th><th class="num">Hoy</th><th></th>' +
        '</tr></thead>' +
        '<tbody>' + filas + '</tbody>' +
      '</table>' +
    '</div>' +
    '<div class="subtexto" style="margin-top:10px">' +
      'Los usuarios no se borran: se desactivan, para no perder el historial de sus visitas.</div>' +
  '</div>';
}

function celdaPin(u) {
  if (u.pinOculto) {
    return '<span class="pin-celda vacio-pin">guardado cifrado</span>' +
           '<div class="sub">usa “PIN nuevo” para verlo</div>';
  }
  if (!u.pin) return '<span class="pin-celda vacio-pin">sin PIN</span>';
  return '<span class="pin-celda">' + (S.verPines ? esc(u.pin) : '••••') + '</span>';
}

function iniciales(nombre) {
  return String(nombre || '').trim().split(/\s+/)
    .map(function (p) { return p.charAt(0); }).join('').slice(0, 2).toUpperCase();
}

/* -------------------- Alta y edición de usuario -------------------- */

function modalUsuario(m) {
  var u = m.usuario || {};
  var esNuevo = !u.usuarioId;

  return '' +
  '<div class="modal" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">' + (esNuevo ? 'Nuevo usuario' : 'Editar usuario') + '</div>' +
      '<div class="sub">' + (esNuevo
        ? 'Podrá entrar a la app con el acceso y el PIN que le pongas aquí.'

    '</div>' +
    '<div class="modal-cuerpo">' +
      '<div class="campo-grid">' +
        '<div class="campo-bloque ancho-total">' +
          '<label for="f-u-nombre">Nombre completo</label>' +
          '<input id="f-u-nombre" value="' + esc(u.nombre || '') + '" placeholder="Génesis Pérez">' +
        '</div>' +
        '<div class="campo-bloque">' +
          '<label for="f-u-usuario">Acceso</label>' +
          '<input id="f-u-usuario" value="' + esc(u.usuario || '') + '" placeholder="genesis.perez" ' +
                 'autocapitalize="none" spellcheck="false">' +
          '<div class="campo-ayuda">Sin espacios ni acentos. Es lo que escribe al entrar.</div>' +

        '<div class="campo-bloque">' +

            '<option value="merc"' + (u.rol === 'admin' ? '' : ' selected') + '>Mercaderista</option>' +
            '<option value="admin"' + (u.rol === 'admin' ? ' selected' : '') + '>Administrador</option>' +

}

/* ============================== MODALES ============================== */

function vistaModal() {
  if (!S.modal) return '';
  var m = S.modal;
  var contenido =
      m.tipo === 'cliente'   ? modalCliente(m)
    : m.tipo === 'dias'      ? modalDias(m)
    : m.tipo === 'item'      ? modalItem(m)
    : m.tipo === 'exportar'  ? modalExportar(m)
    : m.tipo === 'usuario'   ? modalUsuario(m)
    : m.tipo === 'importar'  ? modalImportar(m)
    : m.tipo === 'agenda'    ? modalAgenda(m)
    : m.tipo === 'resultado' ? modalResultado(m)
    : m.tipo === 'merc'      ? modalDetalleMerc(m)
    : m.tipo === 'foto-grande' ? modalFotoGrande(m)
    : m.tipo === 'cliente-fotos' ? modalClienteFotos(m)
    : '';
  return '<div class="velo" data-a="cerrar-velo">' + contenido + '</div>';
}

/* --------------------------- Alta / edición --------------------------- */

function modalCliente(m) {
  var c = m.cliente || {};
  var d = S.maestroDatos;
  var esNuevo = !c.clienteId;

  var campo = function (id, etiqueta, valor, extra) {
    return '<div class="campo-bloque' + (extra && extra.ancho ? ' ancho-total' : '') + '">' +
      '<label for="f-' + id + '">' + esc(etiqueta) + '</label>' +
      '<input id="f-' + id + '" value="' + esc(valor === undefined ? '' : valor) + '"' +
        (extra && extra.tipo ? ' inputmode="' + extra.tipo + '"' : '') +
        (extra && extra.placeholder ? ' placeholder="' + esc(extra.placeholder) + '"' : '') + '>' +
      (extra && extra.ayuda ? '<div class="campo-ayuda">' + esc(extra.ayuda) + '</div>' : '') +
    '</div>';
  };

  return '' +
  '<div class="modal" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">' + (esNuevo ? 'Nuevo cliente' : 'Editar cliente') + '</div>' +
      '<div class="sub">' + (esNuevo ? 'Se agrega al maestro de cartera.'
        : esc(c.clienteId) + ' · los cambios afectan las próximas agendas que generes.') + '</div>' +
    '</div>' +
    '<div class="modal-cuerpo">' +
      '<div class="campo-grid">' +
        campo('nombre', 'Nombre del cliente', c.nombre, { ancho: true, placeholder: 'FARMATODO' }) +
        campo('region', 'Región', c.region, { placeholder: 'Capital' }) +
        campo('localidad', 'Localidad', c.localidad, { placeholder: 'Montalban' }) +
        campo('ubicacion', 'Ubicación', c.ubicacion, { placeholder: 'UCAB' }) +
        campo('ruta', 'Ruta', c.ruta, { placeholder: '1' }) +
        '<div class="campo-bloque">' +
          '<label for="f-frecuencia">Frecuencia semanal</label>' +
          '<select id="f-frecuencia">' +
            [1, 2, 3, 4, 5, 6].map(function (n) {
              return '<option value="' + n + '"' + ((c.frecuencia || 1) === n ? ' selected' : '') + '>' +
                     n + ' vez(es) por semana</option>';
            }).join('') +
          '</select>' +
          '<div class="campo-ayuda">Si marcas días abajo, manda la cantidad de días marcados.</div>' +
        '</div>' +
        '<div class="campo-bloque ancho-total">' +
          '<label>Días de visita</label>' +
          selectorDias(S.diasEdicion, 'dias-cliente') +
        '</div>' +
        '<div class="campo-bloque">' +
          '<label for="f-promotor">Promotor</label>' +
          '<select id="f-promotor">' +
            '<option value="">Sin asignar</option>' +
            d.promotores.map(function (p) {
              return '<option value="' + esc(p.id) + '"' + (c.promotorId === p.id ? ' selected' : '') + '>' +
                     esc(p.nombre) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        campo('direccion', 'Dirección', c.direccion, { ancho: true }) +
        campo('tipo', 'Tipo de local', c.tipo, { placeholder: 'Farmacia' }) +
        campo('geocerca', 'Geocerca (m)', c.geocerca, { tipo: 'numeric', ayuda: 'Vacío usa el valor general.' }) +
        campo('lat', 'Latitud', c.lat, { tipo: 'decimal', ayuda: 'Opcional, habilita el control de geocerca.' }) +
        campo('lng', 'Longitud', c.lng, { tipo: 'decimal' }) +
      '</div>' +
      (esNuevo ? '' :
        '<div class="casilla" style="margin-top:14px">' +
          '<input type="checkbox" id="f-activo"' + (c.activo === false ? '' : ' checked') + '>' +
          '<div><div class="tit">Cliente activo</div>' +
          '<div class="txt">Al desactivarlo deja de aparecer en las agendas nuevas, ' +
          'pero su historial de visitas se conserva.</div></div>' +
        '</div>') +
    '</div>' +
    '<div class="modal-pie">' +
      '<button class="btn-sec" data-a="cerrar-modal">Cancelar</button>' +
      '<button class="btn-pri" data-a="guardar-cliente"' + (S.guardando ? ' disabled' : '') + '>' +
        (S.guardando ? 'Guardando…' : 'Guardar') + '</button>' +
    '</div>' +
  '</div>';
}

/* ------------------- Días de visita en bloque ------------------- */

function modalDias(m) {
  return '' +
  '<div class="modal" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">Días de visita</div>' +
      '<div class="sub">Se aplicará a los ' + S.seleccion.length + ' clientes seleccionados. ' +
        'Su frecuencia pasa a ser la cantidad de días que marques.</div>' +
    '</div>' +
    '<div class="modal-cuerpo">' +
      selectorDias(S.diasEdicion, 'dias-masivo') +
    '</div>' +
    '<div class="modal-pie">' +
      '<button class="btn-sec" data-a="cerrar-modal">Cancelar</button>' +
      '<button class="btn-pri" data-a="aplicar-dias"' + (S.guardando ? ' disabled' : '') + '>' +
        (S.guardando ? 'Aplicando…' : 'Aplicar a ' + S.seleccion.length + ' clientes') + '</button>' +
    '</div>' +
  '</div>';
}

/* ----------------------------- Importar ----------------------------- */

function modalImportar(m) {
  return m.previo ? modalImportarPrevio(m) : modalImportarPegar(m);
}

function modalImportarPegar(m) {
  return '' +
  '<div class="modal ancho" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">Importar cartera</div>' +
      '<div class="sub">Copia el rango desde Excel y pégalo aquí, o suelta un archivo CSV. ' +
        'Nada se guarda hasta que revises la vista previa.</div>' +
    '</div>' +
    '<div class="modal-cuerpo">' +
      '<div class="campo-bloque">' +
        '<label for="f-pegado">Pega aquí la tabla</label>' +
        '<textarea id="f-pegado" placeholder="PROMOTOR&#9;Dias&#9;Turnos&#9;Localidad&#9;Ubicacion&#9;Tienda (BASE)&#10;' +
          'AIMETH ARISMENDI&#9;LUN, VIE&#9;LUN M, VIE M&#9;Tepuy&#9;Las Mercedes&#9;FARMATODO TEPUY">' + esc(m.texto || '') + '</textarea>' +
        '<div class="campo-ayuda">Formato: PROMOTOR, Dias, Turnos (LUN M, VIE T), Localidad, Ubicacion y Tienda, ' +
          'en cualquier orden. También acepta Region, Ruta, Frecuencia, Direccion, Tipo, Lat, Lng o la matriz LUNES…VIERNES. ' +
          'Los promotores que no existan se crean como usuarios con su PIN.</div>' +
      '</div>' +
      '<div style="display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn-sec" data-a="elegir-csv">Abrir un archivo CSV</button>' +
        '<span class="campo-ayuda" style="margin:0">' + esc(m.archivo || 'ningún archivo elegido') + '</span>' +
      '</div>' +
    '</div>' +
    '<div class="modal-pie">' +
      '<button class="btn-sec" data-a="cerrar-modal">Cancelar</button>' +
      '<button class="btn-pri" data-a="previsualizar"' + (S.guardando ? ' disabled' : '') + '>' +
        (S.guardando ? 'Leyendo…' : 'Revisar antes de importar') + '</button>' +
    '</div>' +
  '</div>';
}

function modalImportarPrevio(m) {
  var p = m.previo;
  var r = p.resumen;

  var filas = p.filas.slice(0, 200).map(function (f) {
    return '<tr>' +
      '<td class="num sub">' + f.n + '</td>' +
      '<td><span class="etq-accion ' + f.accion + '">' + f.accion + '</span></td>' +
      '<td><div class="nom">' + esc(f.nombre || '—') + '</div>' +
        (f.avisos.length ? '<div class="aviso-fila">' + esc(f.avisos.join(' · ')) + '</div>' : '') + '</td>' +
      '<td>' + esc(f.region) + '</td>' +
      '<td>' + esc(f.localidad) + '<div class="sub">' + esc(f.ubicacion) + '</div></td>' +
      '<td><span class="pastilla-ruta">' + esc(f.ruta || '—') + '</span></td>' +
      '<td class="num"><span class="frec">' + f.frecuencia + '×</span></td>' +
      '<td>' + esc(f.promotor || '—') +
        (f.promotor && !f.promotorId ? '<div class="aviso-fila">no registrado</div>' : '') + '</td>' +
    '</tr>';
  }).join('');

  var nuevos = r.promotoresNuevos;

  return '' +
  '<div class="modal ancho" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">Revisa antes de importar</div>' +
      '<div class="sub">Columnas reconocidas: ' + esc(p.columnasReconocidas.join(', ')) +
        (p.columnasIgnoradas.length ? ' · ignoradas: ' + esc(p.columnasIgnoradas.join(', ')) : '') + '</div>' +
    '</div>' +
    '<div class="modal-cuerpo">' +
      '<div class="resumen-import">' +
        '<div class="caja bien"><div class="n">' + r.nuevos + '</div><div class="l">Nuevos</div></div>' +
        '<div class="caja"><div class="n">' + r.actualizados + '</div><div class="l">Actualizados</div></div>' +
        '<div class="caja' + (r.repetidos ? ' mal' : '') + '"><div class="n">' + r.repetidos + '</div><div class="l">Repetidos</div></div>' +
        '<div class="caja' + (r.errores ? ' mal' : '') + '"><div class="n">' + r.errores + '</div><div class="l">Con error</div></div>' +
        '<div class="caja"><div class="n">' + r.total + '</div><div class="l">Total</div></div>' +
      '</div>' +

      (nuevos.length
        ? '<div class="casilla" style="margin-bottom:12px">' +
            '<input type="checkbox" id="f-crear-promotores" checked>' +
            '<div><div class="tit">Crear ' + nuevos.length + ' promotor(es) que no existen</div>' +
            '<div class="txt">' + esc(nuevos.join(', ')) + '. Se les genera un usuario y un PIN ' +
            'que verás una sola vez al terminar. Si no marcas esto, esos clientes quedan sin promotor.</div></div>' +
          '</div>'
        : '') +

      '<div class="casilla" style="margin-bottom:14px">' +
        '<input type="checkbox" id="f-desactivar">' +
        '<div><div class="tit">Desactivar los clientes que no están en este archivo</div>' +
        '<div class="txt">Márcalo solo si este archivo es la cartera completa. ' +
        'Los clientes ausentes quedan inactivos, no se borran.</div></div>' +
      '</div>' +

      '<div class="contenedor-tabla" style="max-height:38vh">' +
        '<table class="tabla-cartera">' +
          '<thead><tr><th></th><th>Acción</th><th>Cliente</th><th>Región</th>' +
          '<th>Localidad / Ubicación</th><th>Ruta</th><th class="num">Frec.</th><th>Promotor</th></tr></thead>' +
          '<tbody>' + filas + '</tbody>' +
        '</table>' +
      '</div>' +
      (p.filas.length > 200 ? '<div class="campo-ayuda">Se muestran las primeras 200 filas de ' +
        p.filas.length + '. Se importarán todas.</div>' : '') +
    '</div>' +
    '<div class="modal-pie">' +
      '<button class="btn-sec izq" data-a="volver-pegar">‹ Volver a pegar</button>' +
      '<button class="btn-sec" data-a="cerrar-modal">Cancelar</button>' +
      '<button class="btn-pri" data-a="confirmar-importar"' + (S.guardando ? ' disabled' : '') + '>' +
        (S.guardando ? 'Importando…' : 'Importar ' + (r.total - r.errores) + ' clientes') + '</button>' +
    '</div>' +
  '</div>';
}

/* ------------------------------ Agenda ------------------------------ */

function modalAgenda(m) {
  var d = S.maestroDatos;
  var p = m.previo;

  var carga = p ? p.carga.map(function (c) {
    var max = Math.max(1, c.maximo);
    return '<tr>' +
      '<td><div class="nom">' + esc(c.promotor) + '</div>' +
        '<div class="sub">' + c.clientes + ' clientes · ' + c.rutas + ' rutas</div></td>' +
      '<td><div class="carga-dia">' +
        c.dias.map(function (x) {
          return '<div class="col">' +
            '<div class="bar' + (x.clientes > 10 ? ' alta' : '') + '" style="height:' +
              Math.round(x.clientes / max * 34) + 'px" title="' + x.clientes + ' clientes"></div>' +
            '<div class="d">' + esc(x.dia) + '</div></div>';
        }).join('') +
      '</div></td>' +
      '<td class="num"><strong>' + c.maximo + '</strong><div class="sub">día más cargado</div></td>' +
    '</tr>';
  }).join('') : '';

  return '' +
  '<div class="modal ancho" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">Generar agenda</div>' +
      '<div class="sub">Convierte la cartera en visitas con fecha, en la hoja ' + esc(d.hojaRutas) + '. ' +
        'Cada ruta cae en un día de la semana y la frecuencia decide cuántas veces se repite.</div>' +
    '</div>' +
    '<div class="modal-cuerpo">' +
      '<div class="campo-grid">' +
        '<div class="campo-bloque">' +
          '<label for="f-desde">Desde</label>' +
          '<input id="f-desde" type="date" value="' + esc(m.desde) + '">' +
        '</div>' +
        '<div class="campo-bloque">' +
          '<label for="f-hasta">Hasta</label>' +
          '<input id="f-hasta" type="date" value="' + esc(m.hasta) + '">' +
        '</div>' +
        '<div class="campo-bloque ancho-total">' +
          '<label for="f-agenda-promotor">Promotor</label>' +
          '<select id="f-agenda-promotor">' +
            '<option value="">Todos los promotores</option>' +
            d.promotores.map(function (x) {
              return '<option value="' + esc(x.id) + '"' + (m.promotorId === x.id ? ' selected' : '') + '>' +
                     esc(x.nombre) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
      '</div>' +

      '<div class="casilla" style="margin-top:14px">' +
        '<input type="checkbox" id="f-reemplazar">' +
        '<div><div class="tit">Reemplazar lo que ya exista en esas fechas</div>' +
        '<div class="txt">Sin marcar, solo se agregan las asignaciones que falten y se respeta ' +
        'lo que ya estaba. Marcado, se borra la agenda del rango y se rehace desde cero.</div></div>' +
      '</div>' +

      (d.sinPromotor
        ? '<div class="aviso malo" style="margin-top:12px">' + d.sinPromotor +
          ' cliente(s) no tienen promotor y quedarán fuera de la agenda.</div>'
        : '') +

      (p ? '<div style="margin-top:16px">' +
             '<div class="tarjeta-tit" style="margin-bottom:4px">Cómo quedaría la semana</div>' +
             '<div class="tarjeta-sub">Días hábiles: ' + esc(p.diasHabiles.join(', ')) + '</div>' +
             '<div class="contenedor-tabla" style="max-height:34vh">' +
               '<table class="tabla-cartera"><tbody>' + carga + '</tbody></table>' +
             '</div>' +
           '</div>'
         : '<div class="campo-ayuda" style="margin-top:14px">Pulsa “Ver reparto” para comprobar la carga ' +
           'por día antes de escribir nada.</div>') +
    '</div>' +
    '<div class="modal-pie">' +
      '<button class="btn-sec izq" data-a="previsualizar-agenda">Ver reparto</button>' +
      '<button class="btn-sec" data-a="cerrar-modal">Cancelar</button>' +
      '<button class="btn-pri" data-a="confirmar-agenda"' + (S.guardando ? ' disabled' : '') + '>' +
        (S.guardando ? 'Generando…' : 'Generar agenda') + '</button>' +
    '</div>' +
  '</div>';
}

/* ----------------------------- Resultado ----------------------------- */

function modalResultado(m) {
  return '' +
  '<div class="modal" data-a="dentro">' +
    '<div class="modal-cab">' +
      '<div class="tit">' + esc(m.titulo) + '</div>' +
      '<div class="sub">' + esc(m.texto) + '</div>' +
    '</div>' +
    (m.pines && m.pines.length
      ? '<div class="modal-cuerpo">' +
          '<div class="pines-nuevos">' +
            '<div class="tit">Accesos para entregar</div>' +
            '<div class="txt" style="font-size:11.5px;color:#6A5A2E;margin-bottom:8px">' +
              'Quedan guardados en la hoja <strong>Usuarios</strong> y en la pestaña ' +
              'Promotores, por si necesitas consultarlos después.</div>' +
            '<table>' +
              '<tr><td><strong>Nombre</strong></td><td><strong>Usuario</strong></td><td><strong>PIN</strong></td></tr>' +
              m.pines.map(function (p) {
                return '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(p.usuario) + '</td>' +
                       '<td class="pin">' + esc(p.pin) + '</td></tr>';
              }).join('') +
            '</table>' +
          '</div>' +
        '</div>'
      : '') +
    '<div class="modal-pie">' +
      '<button class="btn-pri" data-a="cerrar-modal">Entendido</button>' +
    '</div>' +
  '</div>';
}
</script>

<script>

var ORDEN_CATALOGOS = ['skus', 'competencia', 'preguntas', 'fotos', 'etiquetas'];

/* ============================== LA VISTA ============================== */

function vistaCatalogos() {
  var d = S.catalogosDatos;
  if (!d) return '<div class="ancho-1180">' + pestanasCartera('catalogos') +
                 '<div class="vacio">Cargando los catálogos…</div></div>';

  return '' +

function tablaCatalogo(tipo, items) {
  var def = CATALOGOS_APP[tipo];
  var tieneObligatorio = tipo !== 'etiquetas';

  var filas = items.length ? items.map(function (it) {
    return '<tr class="' + (it.activo ? '' : 'inactiva') + '">' +
      def.columnas.map(function (col) {
        var v = it[col.k];
        return '<td class="' + (col.num ? 'num' : '') + '">' +
          (col.principal
            ? '<div class="nom">' + esc(v) + '</div><div class="sub">' + esc(it.id) + '</div>'
            : '<span class="' + (col.mono ? 'acceso' : '') + '">' + esc(v || '—') + '</span>') +
        '</td>';
      }).join('') +
      (tieneObligatorio
        ? '<td><button class="interruptor' + (it.obligatorio ? ' on' : '') + '" ' +
            'data-a="obligatorio" data-t="' + tipo + '" data-i="' + esc(it.id) + '">' +
            (it.obligatorio ? 'Obligatorio' : 'Opcional') + '</button></td>'
        : '<td></td>') +
      '<td><button class="interruptor verde' + (it.activo ? ' on' : '') + '" ' +
        'data-a="activo-item" data-t="' + tipo + '" data-i="' + esc(it.id) + '">' +
        (it.activo ? 'Activo' : 'Apagado') + '</button></td>' +
      '<td class="num"><button class="btn-fila" data-a="editar-item" data-t="' + tipo + '" ' +
        'data-i="' + esc(it.id) + '">Editar</button></td>' +

                'style="padding:20px;text-align:center;color:#8B94A2">Todavía no hay nada aquí.</td></tr>';

  var activos = items.filter(function (i) { return i.activo; }).length;
  var obligatorios = items.filter(function (i) { return i.activo && i.obligatorio; }).length;

  return '' +
  '<div class="tarjeta" style="margin-top:12px">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">' +

        '<div class="tarjeta-tit">' + esc(def.titulo) + '</div>' +
        '<div class="tarjeta-sub" style="margin-bottom:0">' + esc(def.sub) + '</div>' +

      '<button class="btn-sec" data-a="nuevo-item" data-t="' + tipo + '">' + esc(def.boton) + '</button>' +
    '</div>' +
    '<div class="tabla-scroll" style="margin-top:12px">' +

      '</table>' +
    '</div>' +
  '</div>';
}

        (S.guardando ? 'Guardando…' : 'Guardar reglas') + '</button>' +

function modalItem(m) {

function modalExportar(m) {

}

<script>
/* ===================================================================
   El Bombón Dorado · App de Gestión de Desarrollo
   JS_Fotos — fotos agrupadas por cliente: tarjeta con su historial,
   evolución en el tiempo y salto directo a una visita puntual.
   Más el análisis de trade marketing hecho a partir de los datos
   (no del contenido de la imagen).
   =================================================================== */

/* ============================== DIRECTORIO ============================== */

function vistaFotos() {
  var d = S.fotosDatos;
  if (!d) return '<div class="ancho-1180"><div class="vacio">Cargando las fotos…</div></div>';

  var f = S.filtrosFotos;

  var tarjetas = d.clientes.length ? d.clientes.map(function (c) {
    return '' +
    '<div class="tarjeta-cliente-fotos" data-a="abrir-cliente-fotos" data-c="' + esc(c.clienteId) + '">' +
      '<div class="tit">' + esc(c.nombre) + '</div>' +
      '<div class="sub">' + esc(c.localidad || c.region || 'sin localidad') + '</div>' +
      '<div class="cifras">' +
        '<div><b>' + c.totalFotos + '</b> fotos</div>' +
        '<div><b>' + c.totalVisitas + '</b> visitas</div>' +
      '</div>' +
      '<div class="pie">' +
        '<span class="dias-chip">última ' + esc(c.ultimaFecha) + '</span>' +
        (c.ultimoSos !== null ? '<span class="chip ' + (c.ultimoSos >= (S.config.metaSos || 30) ? 'chip-verde' : 'chip-oro') +
          '">' + c.ultimoSos + '% share</span>' : '') +
        (c.ultimosQuiebres ? '<span class="chip chip-rojo">' + c.ultimosQuiebres + ' quiebre(s)</span>' : '') +
      '</div>' +
      '<div class="promotor">' + esc(c.promotor || '') + '</div>' +
    '</div>';
  }).join('') : '<div class="vacio">Ningún cliente coincide con el filtro.</div>';

  return '' +
  '<div class="ancho-1180">' +
    '<div class="encabezado-panel">' +
      '<div>' +
        '<div class="fecha-hoy">evidencia fotográfica</div>' +
        '<h1 class="titulo">Fotos por cliente</h1>' +
        '<div class="subtexto">' + d.clientes.length + ' cliente(s) con fotos · ' + d.totalFotos + ' foto(s) en total. ' +
          'Toca un cliente para ver su historial completo.</div>' +
      '</div>' +
    '</div>' +

    '<div class="barra-herramientas">' +
      '<input class="buscador" id="buscadorFotos" placeholder="Buscar cliente o localidad…" ' +
             'value="' + esc(f.texto) + '">' +
      '<select class="filtro" data-a="filtro-fotos" data-f="promotorId">' +
        '<option value="">Todos los promotores</option>' +
        d.promotores.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (f.promotorId === p.id ? ' selected' : '') + '>' +
                 esc(p.nombre) + '</option>';
        }).join('') +
      '</select>' +
      '<select class="filtro" data-a="filtro-fotos" data-f="region">' +
        '<option value="">Todas las regiones</option>' +
        d.regiones.map(function (r) {
          return '<option value="' + esc(r) + '"' + (f.region === r ? ' selected' : '') + '>' + esc(r) + '</option>';
        }).join('') +
      '</select>' +
    '</div>' +

    '<div class="grid-clientes-fotos">' + tarjetas + '</div>' +
  '</div>';
}

/* ========================= HISTORIAL DE UN CLIENTE ========================= */

function modalClienteFotos(m) {
  if (!m.datos) {
    return '<div class="modal-foto ancho-cliente" data-a="dentro">' +
      '<div class="modal-cab"><div class="tit">Cargando…</div></div></div>';
  }

  var d = m.datos;
  var c = d.cliente;
  var r = d.resumen;

  var visitaSel = m.visitaId
    ? d.visitas.filter(function (v) { return v.visitaId === m.visitaId; })[0]
    : d.visitas[0];

  var tendencia = '';
  if (r.sosPrimero !== null && r.sosUltimo !== null && r.sosPrimero !== r.sosUltimo) {
    var dif = Math.round((r.sosUltimo - r.sosPrimero) * 10) / 10;
    tendencia = dif > 0 ? ' · subió ' + dif + ' pts desde la primera visita registrada'
                        : ' · bajó ' + Math.abs(dif) + ' pts desde la primera visita registrada';
  }

  return '' +
  '<div class="modal-foto ancho-cliente" data-a="dentro">' +
    '<div class="modal-cab-cliente">' +
      '<div>' +
        '<div class="tit">' + esc(c.nombre) + '</div>' +
        '<div class="sub">' + esc([c.localidad, c.ubicacion, c.direccion].filter(Boolean).join(' · ')) + '</div>' +
      '</div>' +
      '<button class="btn-sec" data-a="cerrar-modal" style="flex:0 0 auto">Cerrar</button>' +
    '</div>' +

    '<div class="modal-cuerpo-cliente">' +
      '<div class="mini-kpis" style="margin-bottom:14px">' +
        '<div class="mini-kpi"><div class="val">' + r.totalVisitas + '</div><div class="lab">Visitas</div>' +
          '<div class="cmp neutro">' + esc(r.primeraFecha) + ' → ' + esc(r.ultimaFecha) + '</div></div>' +
        '<div class="mini-kpi"><div class="val">' + r.totalFotos + '</div><div class="lab">Fotos</div>' +
          '<div class="cmp neutro">en todo el historial</div></div>' +
        '<div class="mini-kpi"><div class="val">' + (r.sosPromedio === null ? '—' : r.sosPromedio + '%') + '</div>' +
          '<div class="lab">Share promedio</div><div class="cmp neutro">' + esc(tendencia || 'sin variación') + '</div></div>' +
      '</div>' +

      bloqueEvolucionCliente(d.evolucion) +

      '<div class="tarjeta-tit" style="margin:18px 0 8px">Visitas registradas</div>' +
      '<div class="selector-visitas">' +
        d.visitas.map(function (v) {
          var activa = visitaSel && v.visitaId === visitaSel.visitaId;
          return '<button class="chip-visita' + (activa ? ' activa' : '') + '" ' +
                 'data-a="ver-visita-cliente" data-v="' + esc(v.visitaId) + '">' +
            '<span class="f">' + esc(v.fecha) + '</span>' +
            '<span class="n">' + v.fotos.length + ' foto(s)' + (v.quiebres ? ' · ' + v.quiebres + ' quiebre' : '') + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +

      bloqueVisitaSeleccionada(visitaSel) +
    '</div>' +
  '</div>';
}

function bloqueEvolucionCliente(evolucion) {
  if (evolucion.length < 2) {
    return '<div class="campo-ayuda" style="margin-bottom:6px">' +
      (evolucion.length ? 'Todavía hay una sola visita con datos: la evolución se verá desde la segunda.' :
       'Sin datos numéricos para graficar la evolución.') + '</div>';
  }

  var max = Math.max.apply(null, evolucion.map(function (v) { return v.sos || 0; }).concat([10]));

  return '' +
  '<div class="tarjeta" style="padding:14px 16px">' +
    '<div class="tarjeta-tit" style="margin-bottom:2px">Evolución del share of shelf</div>' +

      '<span class="campo-ayuda" style="margin:0">' + esc(evolucion[evolucion.length - 1].fecha) + '</span>' +

function bloqueVisitaSeleccionada(v) {
  if (!v) return '<div class="vacio" style="margin-top:12px">Este cliente todavía no tiene visitas registradas.</div>';

  var fotos = v.fotos.length ? v.fotos.map(function (foto) {

      '<div class="miniatura lazy-foto" data-arch="' + esc(foto.archivoId) + '">' +

/* ---------------------- Foto en grande (desde un cliente) ---------------------- */

function modalFotoGrande(m) {

  '<div class="modal-foto" data-a="dentro">' +

/** Carga diferida de cualquier miniatura pendiente en pantalla (galería o modal). */
function cargarMiniaturas() {
  document.querySelectorAll('.lazy-foto:not([data-cargada])').forEach(function (el) {
    var archivoId = el.getAttribute('data-arch');
    el.setAttribute('data-cargada', '1');
    api('apiFotoAdmin', S.token, archivoId)
      .then(function (r) {
        var vivo = document.querySelector('.lazy-foto[data-arch="' + archivoId + '"]');
        if (!vivo) return;
        vivo.style.backgroundImage = 'url(' + r.dataUrl + ')';
        var texto = vivo.querySelector('.cargando-foto');
        if (texto) texto.remove();
      })
      .catch(function () {
        var vivo = document.querySelector('.lazy-foto[data-arch="' + archivoId + '"]');
        var texto = vivo && vivo.querySelector('.cargando-foto');
        if (texto) texto.textContent = 'sin imagen';
      });
  });
}

/* ======================= ANÁLISIS DE FOTOS ======================= */

function vistaAnalisisFotos() {
  var d = S.analisisFotosDatos;
  if (!d) return '<div class="ancho-1180"><div class="vacio">Analizando la evidencia…</div></div>';

  var c = d.cobertura;

  var periodos = [7, 14, 30].map(function (n) {
    return '<button class="' + (S.diasAnalisisFotos === n ? 'activo' : '') + '" data-a="periodo-fotos" data-d="' + n + '">' +
           n + ' días</button>';

  return '' +
  '<div class="ancho-1180">' +
    '<div class="encabezado-panel">' +
      '<div>' +
        '<div class="fecha-hoy">' + esc(d.periodo.desde) + ' → ' + esc(d.periodo.hasta) + '</div>' +
        '<h1 class="titulo">Trade marketing · evidencia fotográfica</h1>' +
        '<div class="subtexto">Este análisis no mira el contenido de la foto: cruza si existe y ' +
          'si coincide con lo que la visita reportó.</div>' +

      '<div class="selector-periodo">' + periodos + '</div>' +
    '</div>' +

    (d.suficiente ? '' :
      '<div class="aviso" style="margin-bottom:12px">Con ' + d.totalFotos + ' foto(s) en el periodo, ' +
      'las conclusiones son preliminares.</div>') +

    '<div class="tira-indicadores">' +
      indicadorFotos('Cobertura de evidencia', c.pctCobertura + '%',
        c.conTodoLoObligatorio + ' de ' + c.totalVisitas + ' visitas completas',
        c.pctCobertura >= 85 ? 'bien' : c.pctCobertura >= 60 ? 'regular' : 'mal') +
      indicadorFotos('Visitas sin ninguna foto', String(c.sinFotos), 'de ' + c.totalVisitas + ' en el periodo',
        c.sinFotos === 0 ? 'bien' : 'mal') +
      indicadorFotos('Incoherencias', String(d.incoherencias.length), 'dato reportado sin foto de respaldo',
        d.incoherencias.length ? 'mal' : 'bien') +
      indicadorFotos('Total de fotos', String(d.totalFotos), 'en el periodo', 'neutro') +

    bloqueHallazgosFotos(d) +

    '<div class="panel-grid">' +
      '<div class="tarjeta">' +
        '<div class="tarjeta-tit">Evidencia por mercaderista</div>' +
        '<div class="tarjeta-sub">% de visitas con todas las fotos obligatorias.</div>' +
        '<div class="tabla-scroll"><table class="tabla">' +
          d.porPromotor.map(function (p) {
            return '<tr>' +
              '<td>' + esc(p.promotor) + '<div class="tenue">' + p.visitas + ' visitas</div></td>' +
              '<td style="width:40%"><div class="barra-mini"><i class="' + (p.pctCompletas < 50 ? 'bajo' : 'alto') +
                '" style="width:' + p.pctCompletas + '%"></i></div></td>' +
              '<td class="num">' + p.pctCompletas + '%</td>' +
            '</tr>';
          }).join('') +
        '</table></div>' +
      '</div>' +
      '<div class="tarjeta">' +
        '<div class="tarjeta-tit">Qué tan seguido se toma cada foto</div>' +
        '<div class="tarjeta-sub">Sobre el total de visitas del periodo.</div>' +
        '<div class="tabla-scroll"><table class="tabla">' +
          d.porTipoFoto.map(function (t) {
            return '<tr>' +
              '<td>' + esc(t.tag) + (t.obligatoria ? ' <span class="chip chip-oro">obligatoria</span>' : '') + '</td>' +
              '<td style="width:40%"><div class="barra-mini"><i style="width:' + t.pctVisitas + '%"></i></div></td>' +
              '<td class="num">' + t.pctVisitas + '%</td>' +
            '</tr>';
          }).join('') +
        '</table></div>' +
      '</div>' +
    '</div>' +

    bloqueIncoherencias(d) +
  '</div>';
}

function indicadorFotos(label, valor, sub, estado) {
  return '<div class="ind ' + estado + '">' +
    '<div class="lab">' + esc(label) + '</div>' +
    '<div class="val">' + esc(valor) + '</div>' +
    '<div class="sub">' + esc(sub) + '</div>' +

}

function bloqueHallazgosFotos(d) {
  if (!d.hallazgos.length) return '';
  return '' +
  '<div style="margin-top:12px">' +
    '<div class="lista-items" style="gap:10px">' +
      d.hallazgos.map(function (h) {
        return '<div class="hallazgo ' + h.severidad + '">' +
          '<div class="cab"><span class="sev ' + h.severidad + '">' + h.severidad + '</span></div>' +
          '<div class="tit">' + esc(h.titulo) + '</div>' +
          '<div class="evi">' + esc(h.evidencia) + '</div>' +

}

function bloqueIncoherencias(d) {
  if (!d.incoherencias.length) return '';
  return '' +
  '<div class="tarjeta" style="margin-top:12px">' +
    '<div class="tarjeta-tit">Datos sin foto de respaldo</div>' +
    '<div class="tarjeta-sub">Casos puntuales que conviene revisar antes de usarlos en un reporte.</div>' +
    '<div class="lista-items">' +
      d.incoherencias.map(function (i) {
        return '<div class="tira-incoherencia">' +
          '<div class="tit">' + esc(i.cliente) + ' · ' + esc(i.promotor) + ' · ' + esc(i.fecha) + '</div>' +
          '<div class="sub">' + esc(i.detalle) + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';
}
